<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientHub CRM (Firebase Edition)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script>window.react = window.React;</script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide React Icons -->
  <script src="https://unpkg.com/lucide-react@0.284.0/dist/umd/lucide-react.min.js"></script>

  <!-- Bulletproof Firebase Loading Sequence -->
  <script type="module">
    // We wrap the import in a promise attached to the window so React can safely wait for it
    window.firebaseLoadPromise = (async () => {
      try {
        const appMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
        const authMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
        const fsMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
        
        window.FirebaseAPI = {
          initializeApp: appMod.initializeApp,
          getAuth: authMod.getAuth,
          signInWithCustomToken: authMod.signInWithCustomToken,
          signInAnonymously: authMod.signInAnonymously,
          onAuthStateChanged: authMod.onAuthStateChanged,
          getFirestore: fsMod.getFirestore,
          collection: fsMod.collection,
          doc: fsMod.doc,
          addDoc: fsMod.addDoc,
          updateDoc: fsMod.updateDoc,
          deleteDoc: fsMod.deleteDoc,
          onSnapshot: fsMod.onSnapshot
        };
      } catch (err) {
        console.error("Critical error loading Firebase modules:", err);
        throw err;
      }
    })();
  </script>
</head>
<body class="bg-slate-50 text-slate-800">
  
  <!-- Fallback UI to prevent blank screens -->
  <div id="fallback-loader" class="min-h-screen flex flex-col items-center justify-center p-4 text-center">
     <div class="animate-spin w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full mb-4"></div>
     <h2 class="text-lg font-bold text-slate-900">Starting CRM Engine...</h2>
     <p class="text-sm text-slate-500 mt-2 max-w-md">If this screen doesn't disappear in a few seconds, please check your browser's Developer Console (F12) for syntax or connection errors.</p>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;
    
    // Safely extract icons
    const { 
      MessageCircle, MessageSquare, Smartphone, Bot, Wand2, Loader2,
      Users, BarChart3, List, Phone, LayoutGrid, Plus, Search, X, 
      ArrowUpDown, AlertCircle, Edit3, Mail, ChevronLeft, ChevronRight, 
      CheckCircle2, ShieldCheck, Trash2, UserPlus, Check, Copy, Sparkles, Database
    } = window.lucide || {};

    // ==========================================
    // 🔴 1. YOUR GITHUB DEPLOYMENT CONFIGURATION 🔴
    // ==========================================
    // Replace these values with your actual Firebase project settings.
    const MY_FIREBASE_CONFIG = {
      apiKey: "AIzaSyCXyKSTlmlzkYnH2LW408cVVWV1CPvlfBo",
      authDomain: "cmfilings-6a37c.firebaseapp.com",
      projectId: "cmfilings-6a37c",
      storageBucket: "cmfilings-6a37c.firebasestorage.app",
      messagingSenderId: "138705123778",
      appId: "1:138705123778:web:9561bff9f0f5d89bb6fe5b",
      measurementId: "G-09DM4NZF8D"
    };

    // Exponential backoff helper for reliable Gemini API calls
    async function fetchWithBackoff(url, options, maxRetries = 5) {
      const delays = [1000, 2000, 4000, 8000, 16000];
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          return await response.json();
        } catch (error) {
          if (i === maxRetries - 1) throw error;
          await new Promise(resolve => setTimeout(resolve, delays[i]));
        }
      }
    }

    // ==========================================
    // 2. Main Application UI Component
    // ==========================================
    function App({ data, updateItem, deleteItem, insertItem, isMockMode }) {
      const [activeTab, setActiveTab] = useState('analytics'); 
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [branchFilter, setBranchFilter] = useState('ALL');
      const [constitutionFilter, setConstitutionFilter] = useState('ALL');
      const [taxFilter, setTaxFilter] = useState('ALL');
      
      const [sortField, setSortField] = useState('clientId');
      const [sortDirection, setSortDirection] = useState('asc');
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 15;

      const [selectedClient, setSelectedClient] = useState(null);
      const [isDetailOpen, setIsDetailOpen] = useState(false);
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingClient, setEditingClient] = useState(null);
      const [deleteCandidate, setDeleteCandidate] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [copiedField, setCopiedField] = useState('');

      const [isAILoading, setIsAILoading] = useState(false);
      const [aiResponse, setAiResponse] = useState('');
      const [aiInputText, setAiInputText] = useState('');
      const [showAIInput, setShowAIInput] = useState(false);

      const [formData, setFormData] = useState({
        clientId: '', clientName: '', mobile: '', email: '', legalName: '',
        constitution: '', status: 'Active', pan: '', gstin: '', adhar: '',
        address: '', branchId: '', notes: '', folderUrl: ''
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const clients = useMemo(() => {
        if (!Array.isArray(data)) return [];
        return data.map((d) => ({
          id: d.id, clientId: String(d.clientId || ''), clientName: String(d.clientName || 'Unnamed Client'),
          mobile: String(d.mobile || ''), email: String(d.email || ''), legalName: String(d.legalName || ''),
          constitution: String(d.constitution || ''), status: String(d.status || 'Unspecified'),
          pan: String(d.pan || ''), gstin: String(d.gstin || ''), adhar: String(d.adhar || ''),
          address: String(d.address || ''), branchId: String(d.branchId || ''), notes: String(d.notes || ''),
          folderUrl: String(d.folderUrl || ''), createdAt: String(d.createdAt || ''), updatedAt: String(d.updatedAt || '')
        }));
      }, [data]);

      const getNextClientId = () => {
        let maxNum = 40000;
        clients.forEach(c => {
          const num = parseInt(c.clientId.replace(/\D/g, ''), 10);
          if (!isNaN(num) && num > maxNum) maxNum = num;
        });
        return `C${maxNum + 1}`;
      };

      const branchOptions = useMemo(() => {
        const set = new Set();
        clients.forEach(c => { if (c.branchId) set.add(c.branchId); });
        return Array.from(set).sort();
      }, [clients]);

      const constitutionOptions = useMemo(() => {
        const set = new Set();
        clients.forEach(c => { if (c.constitution) set.add(c.constitution); });
        return Array.from(set).sort();
      }, [clients]);

      const filteredClients = useMemo(() => {
        return clients.filter(c => {
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            if (!c.clientName.toLowerCase().includes(q) && !c.clientId.toLowerCase().includes(q) && 
                !c.email.toLowerCase().includes(q) && !c.pan.toLowerCase().includes(q) && 
                !c.mobile.toLowerCase().includes(q) && !c.branchId.toLowerCase().includes(q)) return false;
          }
          if (statusFilter !== 'ALL') {
            if (statusFilter === 'Active' && c.status !== 'Active') return false;
            if (statusFilter === 'Unspecified' && c.status === 'Active') return false;
          }
          if (branchFilter !== 'ALL') {
            if (branchFilter === 'UNASSIGNED' && c.branchId !== '') return false;
            if (branchFilter !== 'UNASSIGNED' && c.branchId !== branchFilter) return false;
          }
          if (constitutionFilter !== 'ALL') {
            if (constitutionFilter === 'UNSPECIFIED' && c.constitution !== '') return false;
            if (constitutionFilter !== 'UNSPECIFIED' && c.constitution !== constitutionFilter) return false;
          }
          if (taxFilter !== 'ALL') {
            if (taxFilter === 'HAS_PAN' && (!c.pan || c.pan === 'PANNOTREQD')) return false;
            if (taxFilter === 'HAS_GST' && (!c.gstin || c.gstin === 'N/A')) return false;
            if (taxFilter === 'NO_TAX' && (c.pan && c.pan !== 'PANNOTREQD' || (c.gstin && c.gstin !== 'N/A'))) return false;
          }
          return true;
        });
      }, [clients, searchQuery, statusFilter, branchFilter, constitutionFilter, taxFilter]);

      const sortedClients = useMemo(() => {
        return [...filteredClients].sort((a, b) => {
          let valA = a[sortField] || ''; let valB = b[sortField] || '';
          if (typeof valA === 'string') valA = valA.toLowerCase();
          if (typeof valB === 'string') valB = valB.toLowerCase();
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filteredClients, sortField, sortDirection]);

      useEffect(() => { setCurrentPage(1); }, [searchQuery, statusFilter, branchFilter, constitutionFilter, taxFilter]);

      const totalPages = Math.max(1, Math.ceil(sortedClients.length / pageSize));
      const paginatedClients = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return sortedClients.slice(start, start + pageSize);
      }, [sortedClients, currentPage, pageSize]);

      const kpis = useMemo(() => {
        const total = clients.length;
        const active = clients.filter(c => c.status === 'Active').length;
        const withPan = clients.filter(c => c.pan && c.pan !== 'PANNOTREQD').length;
        const withGst = clients.filter(c => c.gstin && c.gstin !== 'N/A' && c.gstin !== 'null').length;
        const withContact = clients.filter(c => c.email || c.mobile).length;
        return {
          total, active, activePct: total > 0 ? Math.round((active / total) * 100) : 0,
          withPan, panPct: total > 0 ? Math.round((withPan / total) * 100) : 0,
          withGst, withContact, contactPct: total > 0 ? Math.round((withContact / total) * 100) : 0
        };
      }, [clients]);

      const handleSort = (field) => {
        if (sortField === field) setSortDirection(prev => prev === 'asc' ? 'desc' : 'asc');
        else { setSortField(field); setSortDirection('asc'); }
      };

      const openAddModal = () => {
        setEditingClient(null);
        setFormData({
          clientId: getNextClientId(), clientName: '', mobile: '', email: '', legalName: '',
          constitution: 'Individual', status: 'Active', pan: '', gstin: '', adhar: '',
          address: '', branchId: branchOptions[0] || 'CMF', notes: '', folderUrl: ''
        });
        setIsFormOpen(true);
      };

      const openEditModal = (client, e) => {
        if (e) e.stopPropagation();
        setEditingClient(client);
        setFormData({ ...client });
        setIsFormOpen(true);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!formData.clientName.trim()) return;
        if (editingClient) {
          updateItem({ ...formData, id: editingClient.id });
          showToast(`Updated client ${formData.clientId}`);
        } else {
          insertItem(formData);
          showToast(`Added new client ${formData.clientId}`);
        }
        setIsFormOpen(false);
      };

      const confirmDelete = () => {
        if (deleteCandidate) {
          deleteItem(deleteCandidate.id);
          showToast(`Deleted client ${deleteCandidate.clientId}`);
          setDeleteCandidate(null);
          if (selectedClient && selectedClient.id === deleteCandidate.id) setIsDetailOpen(false);
        }
      };

      const copyToClipboard = (text, fieldName) => {
        if (!text) return;
        document.execCommand('copy'); 
        navigator.clipboard?.writeText(text);
        setCopiedField(fieldName);
        setTimeout(() => setCopiedField(''), 2000);
      };

      const getPhoneLink = (phone, type) => {
        if (!phone) return '#';
        let num = phone.replace(/\D/g, ''); 
        if (num.length === 10) num = '91' + num; 
        switch (type) {
          case 'call': return `tel:+${num}`;
          case 'wa': return `https://wa.me/${num}`;
          case 'sms': return `sms:+${num}`;
          default: return '#';
        }
      };

      const handleImportContact = async () => {
        if ('contacts' in navigator && 'ContactsManager' in window) {
          try {
            const properties = ['name', 'tel', 'email'];
            const contacts = await navigator.contacts.select(properties, { multiple: false });
            if (contacts && contacts.length > 0) {
              const contact = contacts[0];
              let phone = contact.tel?.[0] || '';
              phone = phone.replace(/\D/g, '');
              if (phone.length > 10) phone = phone.slice(-10);
              setFormData(prev => ({ ...prev, clientName: contact.name?.[0] || prev.clientName, mobile: phone, email: contact.email?.[0] || prev.email }));
              showToast('Contact imported successfully!');
            }
          } catch (ex) { showToast('Contact selection cancelled.'); }
        } else { showToast('Contact Picker not supported here.'); }
      };

      const handleAIAutofill = async () => {
        if (!aiInputText.trim()) return;
        setIsAILoading(true);
        try {
          const apiKey = ""; // API Key injected automatically by environment, or supply your own for GitHub Pages
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
          
          const prompt = `Extract client details from the following text and return as JSON. Ignore irrelevant information: "${aiInputText}"`;
          const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              responseMimeType: "application/json",
              responseSchema: {
                type: "OBJECT",
                properties: {
                  clientName: { type: "STRING" }, mobile: { type: "STRING", description: "10 digit mobile number without country code" },
                  email: { type: "STRING" }, pan: { type: "STRING" }, gstin: { type: "STRING" },
                  constitution: { type: "STRING", description: "One of: Individual, Proprietorship, Partnership, Private Limited" }
                }
              }
            }
          };

          const result = await fetchWithBackoff(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const jsonStr = result.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (jsonStr) {
            const parsed = JSON.parse(jsonStr);
            setFormData(prev => ({
              ...prev, clientName: parsed.clientName || prev.clientName, mobile: parsed.mobile || prev.mobile,
              email: parsed.email || prev.email, pan: parsed.pan || prev.pan, gstin: parsed.gstin || prev.gstin, constitution: parsed.constitution || prev.constitution
            }));
            showToast("AI Autofill applied successfully!");
            setShowAIInput(false); setAiInputText('');
          } else { showToast("Could not extract details."); }
        } catch (err) { console.error("AI Autofill Error:", err); showToast("AI Autofill failed. Ensure API key is configured."); } finally { setIsAILoading(false); }
      };

      const draftEmailWithAI = async (client, type) => {
        setIsAILoading(true); setAiResponse('');
        try {
          const apiKey = ""; // API Key injected automatically by environment, or supply your own for GitHub Pages
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
          
          let prompt = `Act as a professional CRM assistant. Write a short, polite email to a client named ${client.clientName}. `;
          if (type === 'missing_tax') prompt += `They are missing their PAN card or GSTIN on file (PAN: ${client.pan || 'Missing'}, GSTIN: ${client.gstin || 'Missing'}). Request them to share it at their earliest convenience.`;
          else if (type === 'check_in') prompt += `Just checking in to see if they need any assistance with our services.`;

          const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: "You are a professional assistant. Output only the email body without subject line or placeholder brackets." }] }
          };

          const result = await fetchWithBackoff(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (text) setAiResponse(text); else showToast("Failed to generate draft.");
        } catch (err) { console.error("AI Draft Error:", err); showToast("AI Drafting failed. Ensure API key is configured."); } finally { setIsAILoading(false); }
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans antialiased pb-24 md:pb-12">
          
          {/* Mock Mode Warning Banner for GitHub deployments without config */}
          {isMockMode && (
             <div className="bg-amber-500 text-white text-xs font-bold px-4 py-2 text-center flex justify-center items-center gap-2">
                <Database className="w-4 h-4" /> 
                Running in Demo Mode. To save data, add your Firebase config in index.html (Lines 44-51).
             </div>
          )}

          {toastMessage && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 md:bottom-5 md:top-auto md:right-5 md:left-auto md:translate-x-0 z-[60] flex items-center gap-2 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-xl text-sm border border-slate-700 w-11/12 md:w-auto max-w-sm">
              <CheckCircle2 className="w-4 h-4 text-emerald-400 shrink-0" />
              <span className="truncate">{toastMessage}</span>
            </div>
          )}

          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <Users className="w-5 h-5" />
                  </div>
                  <div>
                    <h1 className="text-lg font-bold text-slate-900 leading-tight">Client Hub CRM</h1>
                    <p className="text-xs text-slate-500 font-medium">Firebase Edition</p>
                  </div>
                </div>

                <div className="hidden md:flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                  <button onClick={() => setActiveTab('analytics')} className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${activeTab === 'analytics' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}><BarChart3 className="w-4 h-4" /><span>Dashboard</span></button>
                  <button onClick={() => setActiveTab('directory')} className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${activeTab === 'directory' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}><List className="w-4 h-4" /><span>Directory</span></button>
                  <button onClick={() => setActiveTab('contacts')} className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${activeTab === 'contacts' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}><Phone className="w-4 h-4" /><span>Contacts</span></button>
                  <button onClick={() => setActiveTab('kanban')} className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${activeTab === 'kanban' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}><LayoutGrid className="w-4 h-4" /><span>Kanban</span></button>
                </div>

                <div className="flex items-center space-x-3">
                  <button onClick={openAddModal} className="flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors cursor-pointer">
                    <Plus className="w-4 h-4" />
                    <span className="hidden sm:inline">Add Client</span>
                  </button>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            {activeTab === 'analytics' && (
              <div className="space-y-6">
                <div className="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                  <div className="absolute right-0 top-0 translate-x-8 -translate-y-8 opacity-10 pointer-events-none">
                    <Users className="w-64 h-64 text-white" />
                  </div>
                  <div className="relative z-10 max-w-2xl">
                    <div className="inline-flex items-center gap-1.5 bg-indigo-500/30 text-indigo-200 border border-indigo-400/30 text-xs px-2.5 py-1 rounded-full mb-3">
                      <Sparkles className="w-3.5 h-3.5" />
                      <span>Real-time Portfolio Summary</span>
                    </div>
                    <h2 className="text-2xl font-extrabold tracking-tight">Client Portfolio Intelligence</h2>
                    <p className="text-indigo-200 text-xs sm:text-sm mt-1 leading-relaxed">
                      Managing {kpis.total} client records with {kpis.activePct}% active engagement rate across all registered branches.
                    </p>
                    <div className="mt-4 flex flex-wrap gap-3">
                      <button onClick={() => setActiveTab('directory')} className="bg-white text-indigo-900 hover:bg-indigo-50 text-xs font-bold px-4 py-2 rounded-lg transition-colors shadow-sm cursor-pointer">
                        View All {kpis.total} Clients
                      </button>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div className="flex items-center justify-between"><span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Portfolio</span><div className="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center"><Users className="w-4 h-4" /></div></div>
                    <div className="mt-3">
                      <div className="text-3xl font-extrabold text-slate-900">{kpis.total}</div>
                      <div className="flex items-center text-xs text-slate-500 mt-1"><span className="font-semibold text-emerald-600 flex items-center gap-0.5 mr-1"><CheckCircle2 className="w-3 h-3" /> {kpis.active}</span>active clients registered</div>
                    </div>
                  </div>
                  <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div className="flex items-center justify-between"><span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Active Status</span><div className="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center"><CheckCircle2 className="w-4 h-4" /></div></div>
                    <div className="mt-3">
                      <div className="text-3xl font-extrabold text-slate-900">{kpis.activePct}%</div>
                      <div className="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden"><div className="bg-emerald-500 h-full rounded-full transition-all duration-500" style={{ width: `${kpis.activePct}%` }} /></div>
                    </div>
                  </div>
                  <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div className="flex items-center justify-between"><span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">PAN Coverage</span><div className="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center"><ShieldCheck className="w-4 h-4" /></div></div>
                    <div className="mt-3">
                      <div className="text-3xl font-extrabold text-slate-900">{kpis.withPan}</div>
                      <div className="flex items-center justify-between text-xs text-slate-500 mt-1"><span>{kpis.panPct}% recorded</span><span className="text-slate-400">{kpis.withGst} GST registered</span></div>

                  </button>
                  
                  {showAIInput && (
                    <div className="bg-fuchsia-50/50 p-3 rounded-xl border border-fuchsia-100 mb-4 space-y-2">
                      <label className="block text-[10px] font-bold text-fuchsia-800 uppercase">Paste Unstructured Text</label>
                      <textarea value={aiInputText} onChange={(e) => setAiInputText(e.target.value)} placeholder="e.g. Add John Smith from Acme Corp, phone 9998887777, email john@acme.com, GSTIN 29ABCDE1234F1Z5" className="w-full p-2.5 text-xs border border-fuchsia-200 rounded-lg focus:ring-2 focus:ring-fuchsia-500 bg-white min-h-[60px] outline-none" />
                      <div className="flex justify-end">
                        <button type="button" onClick={handleAIAutofill} disabled={isAILoading} className="bg-fuchsia-600 hover:bg-fuchsia-700 disabled:opacity-50 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2 cursor-pointer transition-colors shadow-sm">
                          {isAILoading ? <Loader2 className="w-3.5 h-3.5 animate-spin" /> : <Wand2 className="w-3.5 h-3.5" />} Process Text
                        </button>
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="sm:col-span-2"><label className="block text-slate-600 font-semibold mb-1">Client Name *</label><input type="text" required value={formData.clientName} onChange={(e) => setFormData({ ...formData, clientName: e.target.value })} className="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500" /></div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-600 font-semibold mb-1">Mobile Number</label>
                      <div className="flex shadow-sm rounded-lg">
                        <span className="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-slate-300 bg-slate-50 text-slate-500 font-bold text-sm">+91</span>
                        <input type="tel" placeholder="9876543210" maxLength={10} value={formData.mobile} onChange={(e) => setFormData({ ...formData, mobile: e.target.value.replace(/\D/g, '').slice(0, 10) })} className="flex-1 min-w-0 block w-full px-3 py-2.5 rounded-none rounded-r-lg border border-slate-300 focus:ring-indigo-500 focus:outline-none text-sm font-medium tracking-wide" />
                      </div>
                    </div>
                    <div><label className="block text-slate-600 font-semibold mb-1">Email Address</label><input type="email" value={formData.email} onChange={(e) => setFormData({ ...formData, email: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" /></div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div><label className="block text-slate-600 font-semibold mb-1">PAN Number</label><input type="text" value={formData.pan} onChange={(e) => setFormData({ ...formData, pan: e.target.value.toUpperCase() })} className="w-full p-2.5 border border-slate-200 rounded-lg font-mono uppercase focus:ring-2 focus:ring-indigo-500" /></div>
                    <div><label className="block text-slate-600 font-semibold mb-1">GSTIN Number</label><input type="text" value={formData.gstin} onChange={(e) => setFormData({ ...formData, gstin: e.target.value.toUpperCase() })} className="w-full p-2.5 border border-slate-200 rounded-lg font-mono uppercase focus:ring-2 focus:ring-indigo-500" /></div>
                  </div>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                     <div>
                      <label className="block text-slate-600 font-semibold mb-1">Status</label>
                      <select value={formData.status} onChange={(e) => setFormData({ ...formData, status: e.target.value })} className="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="Active">Active</option>
                        <option value="Unspecified">Unspecified / Pending</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 font-semibold mb-1">Constitution</label>
                      <select value={formData.constitution} onChange={(e) => setFormData({ ...formData, constitution: e.target.value })} className="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="">(Select Entity Type)</option>
                        <option value="Individual">Individual</option>
                        <option value="Proprietorship">Proprietorship</option>
                        <option value="Partnership">Partnership</option>
                        <option value="Private Limited">Private Limited</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-200 flex items-center justify-end space-x-2 pb-2">
                    <button type="button" onClick={() => setIsFormOpen(false)} className="px-4 py-2 border border-slate-200 rounded-lg text-slate-600 font-semibold">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-sm">{editingClient ? 'Save Changes' : 'Create Client'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {deleteCandidate && (
            <div className="fixed inset-0 z-[70] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 animate-in zoom-in-95 duration-200">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4"><Trash2 className="w-6 h-6" /></div>
                <h3 className="text-base font-bold text-slate-900 text-center">Delete Client Record?</h3>
                <div className="mt-6 flex items-center space-x-2">
                  <button onClick={() => setDeleteCandidate(null)} className="flex-1 py-2 border border-slate-200 rounded-lg text-xs font-semibold">Cancel</button>
                  <button onClick={confirmDelete} className="flex-1 py-2 bg-rose-600 text-white rounded-lg text-xs font-bold">Delete Client</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. Database & Firebase Initializer
    // ==========================================
    function FirebaseAppWrapper() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [user, setUser] = useState(null);
      const [error, setError] = useState(null);
      const [fb, setFb] = useState(null); 
      const [isMockMode, setIsMockMode] = useState(false);

      // Hide the raw HTML loader once React takes over
      useEffect(() => {
        const rawLoader = document.getElementById('fallback-loader');
        if (rawLoader) rawLoader.style.display = 'none';
      }, []);

      useEffect(() => {
        let unsubscribeAuth = null;
        let unsubscribeSnap = null;

        const initFirebase = async () => {
          try {
            // 1. Wait for Firebase scripts to finish downloading
            await window.firebaseLoadPromise;
            const FB = window.FirebaseAPI;
            
            // 2. Decide if we are using Real config or Mock Data
            // We check if the user actually pasted their API key in MY_FIREBASE_CONFIG
            let config = MY_FIREBASE_CONFIG;
            
            if (!config || !config.apiKey || config.apiKey === "YOUR_API_KEY") {
                console.warn("No valid Firebase config provided. Falling back to Demo Mode.");
                setFb({ isMock: true });
                setIsMockMode(true);
                setData([
                  { id: '1', clientId: 'C40001', clientName: 'Demo Client (Acme Corp)', mobile: '9876543210', email: 'admin@acme.test', constitution: 'Private Limited', status: 'Active', pan: 'ABCDE1234F', gstin: '29ABCDE1234F1Z5', branchId: 'HQ' },
                  { id: '2', clientId: 'C40002', clientName: 'John Doe Enterprises', mobile: '9998887776', email: 'johndoe@test.com', constitution: 'Proprietorship', status: 'Unspecified', pan: 'PANNOTREQD', gstin: 'N/A', branchId: 'CMF' }
                ]);
                setLoading(false);
                return;
            }

            const appId = config.appId || 'default-crm-app';
            const app = FB.initializeApp(config);
            const auth = FB.getAuth(app);
            const db = FB.getFirestore(app);
            
            setFb({
               db, appId,
               addDoc: FB.addDoc, updateDoc: FB.updateDoc,
               deleteDoc: FB.deleteDoc, collection: FB.collection, doc: FB.doc
            });

            // 3. Connect Authentication
            await FB.signInAnonymously(auth);

            // 4. Securely fetch data
            unsubscribeAuth = FB.onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              if (currentUser) {
                 const collRef = FB.collection(db, 'artifacts', appId, 'users', currentUser.uid, 'clients');
                 unsubscribeSnap = FB.onSnapshot(collRef, (snapshot) => {
                    const clientsList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setData(clientsList);
                    setLoading(false);
                 }, (err) => {
                    setError(`Firestore Permission Denied. Did you enable Anonymous Auth in Firebase Console? Details: ${err.message}`);
                    setLoading(false);
                 });
              }
            });
          } catch (e) {
             setError(e.message || "Unknown error initializing Firebase.");
             setLoading(false);
          }
        };
        
        initFirebase();

        return () => {
           if (unsubscribeAuth) unsubscribeAuth();
           if (unsubscribeSnap) unsubscribeSnap();
        };
      }, []);

      const insertItem = async (clientData) => {
         if (fb?.isMock) { setData(prev => [...prev, { ...clientData, id: Date.now().toString() }]); return; }
         if (!fb || !user) return;
         try {
             const collRef = fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'clients');
             await fb.addDoc(collRef, { ...clientData, createdAt: new Date().toISOString() });
         } catch(e) { console.error("Error adding doc: ", e); }
      };
      
      const updateItem = async (clientData) => {
         if (fb?.isMock) { setData(prev => prev.map(c => c.id === clientData.id ? clientData : c)); return; }
         if (!fb || !user) return;
         try {
             const { id, ...dataToUpdate } = clientData;
             const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'clients', id);
             dataToUpdate.updatedAt = new Date().toISOString();
             await fb.updateDoc(docRef, dataToUpdate);
         } catch(e) { console.error("Error updating doc: ", e); }
      };
      
      const deleteItem = async (id) => {
         if (fb?.isMock) { setData(prev => prev.filter(c => c.id !== id)); return; }
         if (!fb || !user) return;
         try {
             const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'clients', id);
             await fb.deleteDoc(docRef);
         } catch(e) { console.error("Error deleting doc: ", e); }
      };

      if (error) {
        return (
           <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 gap-4 p-6 text-center">
              <div className="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mb-2 shadow-sm border border-rose-200">
                <AlertCircle className="w-8 h-8" />
              </div>
              <div className="text-slate-900 font-extrabold text-2xl">Configuration Error</div>
              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 max-w-lg text-left text-sm text-slate-700 font-mono">
                 {error}
              </div>
           </div>
        );
      }
      
      if (loading) {
        return (
           <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 gap-4">
              <Loader2 className="animate-spin text-indigo-600 w-10 h-10" />
              <p className="text-slate-500 font-medium text-sm animate-pulse">Connecting to Secure CRM Database...</p>
           </div>
        );
      }

      return <App data={data} insertItem={insertItem} updateItem={updateItem} deleteItem={deleteItem} isMockMode={isMockMode} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FirebaseAppWrapper />);
  </script>
</body>
</html>
