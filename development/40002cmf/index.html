<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientHub CRM</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (Production versions for speed, fallback to development if needed) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Polyfill for some UMD modules expecting 'react' -->
  <script>window.react = window.React;</script>
  
  <!-- Babel Standalone (Compiles JSX in the browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide React Icons (Downgraded slightly for stable UMD build) -->
  <script src="https://unpkg.com/lucide-react@0.284.0/dist/umd/lucide-react.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <!-- Mount point for React -->
  <div id="root"></div>

  <script type="text/babel">
    // 1. Extract React Hooks and Components from Global Scope
    const { useState, useMemo, useEffect } = React;
    
    // 2. Import Lucide Icons correctly for the browser
    const { 
      MessageCircle, MessageSquare, Smartphone, Bot, Wand2, Loader2,
      Users, BarChart3, List, Phone, LayoutGrid, Plus, Search, X, 
      ArrowUpDown, AlertCircle, Edit3, Mail, ChevronLeft, ChevronRight, 
      CheckCircle2, ShieldCheck, Trash2, UserPlus, Check, Copy, Sparkles
    } = lucide;

    // 3. Main Application Component
    function App({ data, updateItem, deleteItem, insertItem }) {
      // Navigation & View States
      const [activeTab, setActiveTab] = useState('analytics'); // 'analytics' | 'directory' | 'kanban' | 'contacts'
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [branchFilter, setBranchFilter] = useState('ALL');
      const [constitutionFilter, setConstitutionFilter] = useState('ALL');
      const [taxFilter, setTaxFilter] = useState('ALL');
      
      // Table Sorting & Pagination
      const [sortField, setSortField] = useState('clientId');
      const [sortDirection, setSortDirection] = useState('asc');
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 15;

      // Modal / Drawer States
      const [selectedClient, setSelectedClient] = useState(null);
      const [isDetailOpen, setIsDetailOpen] = useState(false);
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingClient, setEditingClient] = useState(null);
      const [deleteCandidate, setDeleteCandidate] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [copiedField, setCopiedField] = useState('');

      const [isAILoading, setIsAILoading] = useState(false);
      const [aiResponse, setAiResponse] = useState('');
      const [aiInputText, setAiInputText] = useState('');
      const [showAIInput, setShowAIInput] = useState(false);

      const [formData, setFormData] = useState({
        clientId: '',
        clientName: '',
        mobile: '',
        email: '',
        legalName: '',
        constitution: '',
        status: 'Active',
        pan: '',
        gstin: '',
        adhar: '',
        address: '',
        branchId: '',
        notes: '',
        folderUrl: ''
      });

      // Display Toast Notification
      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Locate Header Row Dynamically
      const headerIndex = useMemo(() => {
        if (!Array.isArray(data) || data.length === 0) return 0;
        const idx = data.findIndex(d => d.row && (d.row[0] === 'ClientId' || d.row[1] === 'ClientName'));
        return idx !== -1 ? idx : 0;
      }, [data]);

      // Transform raw envelopes into parsed Client Objects
      const clients = useMemo(() => {
        if (!Array.isArray(data)) return [];
        return data
          .filter((d, idx) => idx !== headerIndex && d.row && (d.row[0] || d.row[1]))
          .map((d) => {
            const r = d.row || [];
            return {
              index_: d.index_,
              clientId: r[0] ? String(r[0]).trim() : '',
              clientName: r[1] ? String(r[1]).trim() : 'Unnamed Client',
              mobile: r[2] !== null && r[2] !== undefined && r[2] !== '' ? String(r[2]).trim() : '',
              email: r[3] !== null && r[3] !== undefined && r[3] !== '' ? String(r[3]).trim() : '',
              legalName: r[4] !== null && r[4] !== undefined && r[4] !== '' ? String(r[4]).trim() : '',
              constitution: r[5] !== null && r[5] !== undefined && r[5] !== '' ? String(r[5]).trim() : '',
              status: r[6] && String(r[6]).trim() !== '' ? String(r[6]).trim() : 'Unspecified',
              pan: r[7] !== null && r[7] !== undefined && r[7] !== '' ? String(r[7]).trim() : '',
              gstin: r[8] !== null && r[8] !== undefined && r[8] !== '' ? String(r[8]).trim() : '',
              adhar: r[9] !== null && r[9] !== undefined && r[9] !== '' ? String(r[9]).trim() : '',
              address: r[10] !== null && r[10] !== undefined && r[10] !== '' ? String(r[10]).trim() : '',
              branchId: r[11] !== null && r[11] !== undefined && r[11] !== '' ? String(r[11]).trim() : '',
              notes: r[12] !== null && r[12] !== undefined && r[12] !== '' ? String(r[12]).trim() : '',
              folderUrl: r[13] !== null && r[13] !== undefined && r[13] !== '' ? String(r[13]).trim() : '',
              createdAt: r[14] ? String(r[14]).trim() : '',
              updatedAt: r[15] ? String(r[15]).trim() : '',
              rawRow: r
            };
          });
      }, [data, headerIndex]);

      // Compute Auto Next Client ID
      const getNextClientId = () => {
        let maxNum = 40000;
        clients.forEach(c => {
          const num = parseInt(c.clientId.replace(/\D/g, ''), 10);
          if (!isNaN(num) && num > maxNum) {
            maxNum = num;
          }
        });
        return `C${maxNum + 1}`;
      };

      // Convert Client Object back to raw row array matching sheet headers
      const clientToRow = (client) => {
        return [
          client.clientId || getNextClientId(),
          client.clientName || '',
          client.mobile || null,
          client.email || null,
          client.legalName || null,
          client.constitution || null,
          client.status || 'Active',
          client.pan || null,
          client.gstin || null,
          client.adhar || null,
          client.address || null,
          client.branchId || null,
          client.notes || null,
          client.folderUrl || null,
          client.createdAt || new Date().toISOString().slice(0, 10),
          new Date().toISOString().slice(0, 10)
        ];
      };

      // Unique Options for Filters
      const branchOptions = useMemo(() => {
        const set = new Set();
        clients.forEach(c => { if (c.branchId) set.add(c.branchId); });
        return Array.from(set).sort();
      }, [clients]);

      const constitutionOptions = useMemo(() => {
        const set = new Set();
        clients.forEach(c => { if (c.constitution) set.add(c.constitution); });
        return Array.from(set).sort();
      }, [clients]);

      // Filtered Clients
      const filteredClients = useMemo(() => {
        return clients.filter(c => {
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const matchName = c.clientName.toLowerCase().includes(q);
            const matchId = c.clientId.toLowerCase().includes(q);
            const matchEmail = c.email.toLowerCase().includes(q);
            const matchPan = c.pan.toLowerCase().includes(q);
            const matchMobile = c.mobile.toLowerCase().includes(q);
            const matchBranch = c.branchId.toLowerCase().includes(q);
            if (!matchName && !matchId && !matchEmail && !matchPan && !matchMobile && !matchBranch) {
              return false;
            }
          }
          if (statusFilter !== 'ALL') {
            if (statusFilter === 'Active' && c.status !== 'Active') return false;
            if (statusFilter === 'Unspecified' && c.status === 'Active') return false;
          }
          if (branchFilter !== 'ALL') {
            if (branchFilter === 'UNASSIGNED' && c.branchId !== '') return false;
            if (branchFilter !== 'UNASSIGNED' && c.branchId !== branchFilter) return false;
          }
          if (constitutionFilter !== 'ALL') {
            if (constitutionFilter === 'UNSPECIFIED' && c.constitution !== '') return false;
            if (constitutionFilter !== 'UNSPECIFIED' && c.constitution !== constitutionFilter) return false;
          }
          if (taxFilter !== 'ALL') {
            if (taxFilter === 'HAS_PAN' && (!c.pan || c.pan === 'PANNOTREQD')) return false;
            if (taxFilter === 'HAS_GST' && (!c.gstin || c.gstin === 'N/A')) return false;
            if (taxFilter === 'NO_TAX' && (c.pan && c.pan !== 'PANNOTREQD' || (c.gstin && c.gstin !== 'N/A'))) return false;
          }
          return true;
        });
      }, [clients, searchQuery, statusFilter, branchFilter, constitutionFilter, taxFilter]);

      // Sorted Clients
      const sortedClients = useMemo(() => {
        return [...filteredClients].sort((a, b) => {
          let valA = a[sortField] || '';
          let valB = b[sortField] || '';
          if (typeof valA === 'string') valA = valA.toLowerCase();
          if (typeof valB === 'string') valB = valB.toLowerCase();
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filteredClients, sortField, sortDirection]);

      // Reset pagination when filter changes
      useEffect(() => {
        setCurrentPage(1);
      }, [searchQuery, statusFilter, branchFilter, constitutionFilter, taxFilter]);

      // Pagination Slice
      const totalPages = Math.max(1, Math.ceil(sortedClients.length / pageSize));
      const paginatedClients = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return sortedClients.slice(start, start + pageSize);
      }, [sortedClients, currentPage, pageSize]);

      // Dashboard Aggregates & KPIs
      const kpis = useMemo(() => {
        const total = clients.length;
        const active = clients.filter(c => c.status === 'Active').length;
        const withPan = clients.filter(c => c.pan && c.pan !== 'PANNOTREQD').length;
        const withGst = clients.filter(c => c.gstin && c.gstin !== 'N/A' && c.gstin !== 'null').length;
        const withContact = clients.filter(c => c.email || c.mobile).length;
        const withFolder = clients.filter(c => c.folderUrl).length;

        const branches = {};
        const constitutions = {};
        clients.forEach(c => {
          const b = c.branchId || 'Unassigned';
          branches[b] = (branches[b] || 0) + 1;
          const con = c.constitution || 'Unspecified';
          constitutions[con] = (constitutions[con] || 0) + 1;
        });

        return {
          total,
          active,
          activePct: total > 0 ? Math.round((active / total) * 100) : 0,
          withPan,
          panPct: total > 0 ? Math.round((withPan / total) * 100) : 0,
          withGst,
          gstPct: total > 0 ? Math.round((withGst / total) * 100) : 0,
          withContact,
          contactPct: total > 0 ? Math.round((withContact / total) * 100) : 0,
          withFolder,
          branches,
          constitutions
        };
      }, [clients]);

      const handleSort = (field) => {
        if (sortField === field) {
          setSortDirection(prev => prev === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDirection('asc');
        }
      };

      const openAddModal = () => {
        setEditingClient(null);
        setFormData({
          clientId: getNextClientId(),
          clientName: '',
          mobile: '',
          email: '',
          legalName: '',
          constitution: 'Individual',
          status: 'Active',
          pan: '',
          gstin: '',
          adhar: '',
          address: '',
          branchId: branchOptions[0] || 'CMF',
          notes: '',
          folderUrl: ''
        });
        setIsFormOpen(true);
      };

      const openEditModal = (client, e) => {
        if (e) e.stopPropagation();
        setEditingClient(client);
        setFormData({
          ...client
        });
        setIsFormOpen(true);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!formData.clientName.trim()) return;

        const rowArray = clientToRow(formData);
        if (editingClient) {
          updateItem(editingClient.index_, rowArray);
          showToast(`Updated client ${formData.clientId} (${formData.clientName})`);
        } else {
          insertItem(undefined, rowArray);
          showToast(`Added new client ${formData.clientId}`);
        }
        setIsFormOpen(false);
      };

      const confirmDelete = () => {
        if (deleteCandidate) {
          deleteItem(deleteCandidate.index_);
          showToast(`Deleted client ${deleteCandidate.clientId}`);
          setDeleteCandidate(null);
          if (selectedClient && selectedClient.index_ === deleteCandidate.index_) {
            setIsDetailOpen(false);
          }
        }
      };

      const handleStatusChange = (client, newStatus) => {
        const updated = { ...client, status: newStatus };
        const rowArray = clientToRow(updated);
        updateItem(client.index_, rowArray);
        showToast(`Updated status for ${client.clientId} to ${newStatus}`);
      };

      const copyToClipboard = (text, fieldName) => {
        if (!text) return;
        navigator.clipboard.writeText(text);
        setCopiedField(fieldName);
        setTimeout(() => setCopiedField(''), 2000);
      };

      // Extracts digits from phone number and ensures 91 prefix for links
      const getPhoneLink = (phone, type) => {
        if (!phone) return '#';
        let num = phone.replace(/\D/g, ''); 
        if (num.length === 10) num = '91' + num; 
        
        switch (type) {
          case 'call': return `tel:+${num}`;
          case 'wa': return `https://wa.me/${num}`;
          case 'sms': return `sms:+${num}`;
          default: return '#';
        }
      };

      // Uses Native Contact Picker API for mobile devices
      const handleImportContact = async () => {
        if ('contacts' in navigator && 'ContactsManager' in window) {
          try {
            const properties = ['name', 'tel', 'email'];
            const contacts = await navigator.contacts.select(properties, { multiple: false });
            if (contacts && contacts.length > 0) {
              const contact = contacts[0];
              let phone = contact.tel?.[0] || '';
              phone = phone.replace(/\D/g, '');
              if (phone.length > 10) phone = phone.slice(-10);

              setFormData(prev => ({
                ...prev,
                clientName: contact.name?.[0] || prev.clientName,
                mobile: phone,
                email: contact.email?.[0] || prev.email
              }));
              showToast('Contact imported successfully!');
            }
          } catch (ex) {
            showToast('Contact selection cancelled.');
          }
        } else {
          showToast('Contact Picker not supported here.');
        }
      };

      const handleAIAutofill = () => {
        if (!aiInputText.trim()) return;
        setIsAILoading(true);
        
        if (typeof google === 'undefined' || !google.script) {
            showToast("Cannot run AI: Google Apps Script not detected. Deploy as Web App.");
            setIsAILoading(false);
            return;
        }

        google.script.run
          .withSuccessHandler((jsonStr) => {
            try {
              const parsed = JSON.parse(jsonStr);
              setFormData(prev => ({
                ...prev,
                clientName: parsed.clientName || prev.clientName,
                mobile: parsed.mobile || prev.mobile,
                email: parsed.email || prev.email,
                pan: parsed.pan || prev.pan,
                gstin: parsed.gstin || prev.gstin,
                constitution: parsed.constitution || prev.constitution
              }));
              showToast("AI Autofill applied successfully!");
              setShowAIInput(false);
              setAiInputText('');
            } catch (err) {
              showToast("Could not extract details.");
            }
            setIsAILoading(false);
          })
          .withFailureHandler((err) => {
            console.error("AI Autofill Error:", err);
            showToast("AI Autofill failed.");
            setIsAILoading(false);
          })
          .processAIAutofill(aiInputText);
      };

      const draftEmailWithAI = (client, type) => {
        setIsAILoading(true);
        setAiResponse('');
        
        if (typeof google === 'undefined' || !google.script) {
            showToast("Cannot run AI: Google Apps Script not detected. Deploy as Web App.");
            setIsAILoading(false);
            return;
        }

        google.script.run
          .withSuccessHandler((text) => {
            setAiResponse(text);
            setIsAILoading(false);
          })
          .withFailureHandler((err) => {
            console.error("AI Draft Error:", err);
            showToast("AI Drafting failed.");
            setIsAILoading(false);
          })
          .generateAIEmailDraft(client.clientName, client.pan, client.gstin, type);
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans antialiased pb-24 md:pb-12">
          {/* Toast Banner */}
          {toastMessage && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 md:bottom-5 md:top-auto md:right-5 md:left-auto md:translate-x-0 z-[60] flex items-center gap-2 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-xl text-sm border border-slate-700 w-11/12 md:w-auto max-w-sm">
              <CheckCircle2 className="w-4 h-4 text-emerald-400 shrink-0" />
              <span className="truncate">{toastMessage}</span>
            </div>
          )}

          {/* Main Navigation Header (Desktop) */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                
                {/* Branding */}
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <Users className="w-5 h-5" />
                  </div>
                  <div>
                    <h1 className="text-lg font-bold text-slate-900 leading-tight">Client Hub CRM</h1>
                    <p className="text-xs text-slate-500 font-medium">Enterprise Directory & Portfolio</p>
                  </div>
                </div>

                {/* View Switcher Tabs - Hidden on Mobile */}
                <div className="hidden md:flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                  <button
                    onClick={() => setActiveTab('analytics')}
                    className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                      activeTab === 'analytics' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <BarChart3 className="w-4 h-4" />
                    <span>Dashboard</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('directory')}
                    className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                      activeTab === 'directory' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <List className="w-4 h-4" />
                    <span>Directory</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('contacts')}
                    className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                      activeTab === 'contacts' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Phone className="w-4 h-4" />
                    <span>Contacts</span>
                  </button>
                  <button
                    onClick={() => setActiveTab('kanban')}
                    className={`flex items-center space-x-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all cursor-pointer ${
                      activeTab === 'kanban' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <LayoutGrid className="w-4 h-4" />
                    <span>Kanban</span>
                  </button>
                </div>

                {/* Top Action Button */}
                <div className="flex items-center space-x-3">
                  <button
                    onClick={openAddModal}
                    className="flex items-center space-x-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm transition-colors cursor-pointer"
                  >
                    <Plus className="w-4 h-4" />
                    <span className="hidden sm:inline">Add Client</span>
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Main Content Body */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

            {/* ==================== TAB 1: ANALYTICS DASHBOARD ==================== */}
            {activeTab === 'analytics' && (
              <div className="space-y-6">
                {/* Header Greeting Banner */}
                <div className="bg-gradient-to-r from-indigo-900 via-indigo-800 to-slate-900 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                  <div className="absolute right-0 top-0 translate-x-8 -translate-y-8 opacity-10 pointer-events-none">
                    <Users className="w-64 h-64 text-white" />
                  </div>
                  <div className="relative z-10 max-w-2xl">
                    <div className="inline-flex items-center gap-1.5 bg-indigo-500/30 text-indigo-200 border border-indigo-400/30 text-xs px-2.5 py-1 rounded-full mb-3">
                      <Sparkles className="w-3.5 h-3.5" />
                      <span>Real-time Portfolio Summary</span>
                    </div>
                    <h2 className="text-2xl font-extrabold tracking-tight">Client Portfolio Intelligence</h2>
                    <p className="text-indigo-200 text-xs sm:text-sm mt-1 leading-relaxed">
                      Managing {kpis.total} client records with {kpis.activePct}% active engagement rate across all registered branches.
                    </p>
                    <div className="mt-4 flex flex-wrap gap-3">
                      <button
                        onClick={() => setActiveTab('directory')}
                        className="bg-white text-indigo-900 hover:bg-indigo-50 text-xs font-bold px-4 py-2 rounded-lg transition-colors shadow-sm cursor-pointer"
                      >
                        View All {kpis.total} Clients
                      </button>
                    </div>
                  </div>
                </div>

                {/* KPI Summary Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Portfolio</span>
                      <div className="w-8 h-8 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center">
                        <Users className="w-4 h-4" />
                      </div>
                    </div>
                    <div className="mt-3">
                      <div className="text-3xl font-extrabold text-slate-900">{kpis.total}</div>
                      <div className="flex items-center text-xs text-slate-500 mt-1">
                        <span className="font-semibold text-emerald-600 flex items-center gap-0.5 mr-1">
                          <CheckCircle2 className="w-3 h-3" /> {kpis.active}
                        </span>
                        active clients registered
                      </div>
                    </div>
                  </div>
                  <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Active Status</span>
                      <div className="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
                        <CheckCircle2 className="w-4 h-4" />
                      </div>
                    </div>
                    <div className="mt-3">
                      <div className="text-3xl font-extrabold text-slate-900">{kpis.activePct}%</div>
                      <div className="w-full bg-slate-100 h-2 rounded-full mt-2 overflow-hidden">
                        <div className="bg-emerald-500 h-full rounded-full transition-all duration-500" style={{ width: `${kpis.activePct}%` }} />
                      </div>
                    </div>
                  </div>
                  <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-semibold text-slate-500 uppercase tracking-wider">PAN Coverage</span>

                </div>

                <div className="p-4 border-t border-slate-200 bg-slate-50 flex items-center space-x-2 pb-safe">
                  <button onClick={(e) => openEditModal(selectedClient, e)} className="flex-1 flex items-center justify-center space-x-1.5 bg-indigo-600 text-white py-2.5 rounded-lg font-semibold text-sm transition-colors">
                    <Edit3 className="w-4 h-4" /><span>Edit Record</span>
                  </button>
                  <button onClick={() => setDeleteCandidate(selectedClient)} className="p-2.5 border border-rose-200 text-rose-600 rounded-lg">
                    <Trash2 className="w-5 h-5" />
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Add / Edit Client Modal */}
          {isFormOpen && (
            <div className="fixed inset-0 z-[60] overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 animate-in fade-in">
              <div className="bg-white rounded-2xl shadow-2xl max-w-xl w-full overflow-hidden border border-slate-200 mt-10 mb-20 sm:my-auto">
                <div className="p-4 sm:p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">
                      {editingClient ? <Edit3 className="w-4 h-4" /> : <UserPlus className="w-4 h-4" />}
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-slate-900">{editingClient ? `Edit ${formData.clientId}` : 'Register Client'}</h3>
                    </div>
                  </div>
                  <button onClick={() => setIsFormOpen(false)} className="p-1 text-slate-400"><X className="w-5 h-5" /></button>
                </div>

                <form onSubmit={handleFormSubmit} className="p-4 sm:p-6 space-y-4 max-h-[70vh] overflow-y-auto text-xs">
                  {!editingClient && 'contacts' in navigator && (
                    <button type="button" onClick={handleImportContact} className="w-full flex items-center justify-center gap-2 bg-indigo-50 text-indigo-700 py-3 rounded-xl border border-indigo-200 font-bold mb-4 cursor-pointer hover:bg-indigo-100"><Smartphone className="w-4 h-4" /> Import from Phone</button>
                  )}
                  
                  <button type="button" onClick={() => setShowAIInput(!showAIInput)} className="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-purple-50 to-fuchsia-50 text-fuchsia-700 py-3 rounded-xl border border-fuchsia-200 font-bold mb-4 shadow-sm hover:bg-fuchsia-100 transition-colors cursor-pointer">
                     <Sparkles className="w-4 h-4" /> Magic Autofill with Gemini AI
                  </button>
                  
                  {showAIInput && (
                    <div className="bg-fuchsia-50/50 p-3 rounded-xl border border-fuchsia-100 mb-4 space-y-2">
                      <label className="block text-[10px] font-bold text-fuchsia-800 uppercase">Paste Unstructured Text</label>
                      <textarea 
                        value={aiInputText} 
                        onChange={(e) => setAiInputText(e.target.value)}
                        placeholder="e.g. Add John Smith from Acme Corp, phone 9998887777, email john@acme.com, GSTIN 29ABCDE1234F1Z5"
                        className="w-full p-2.5 text-xs border border-fuchsia-200 rounded-lg focus:ring-2 focus:ring-fuchsia-500 bg-white min-h-[60px] outline-none"
                      />
                      <div className="flex justify-end">
                        <button type="button" onClick={handleAIAutofill} disabled={isAILoading} className="bg-fuchsia-600 hover:bg-fuchsia-700 disabled:opacity-50 text-white text-xs font-bold px-4 py-2 rounded-lg flex items-center gap-2 cursor-pointer transition-colors shadow-sm">
                          {isAILoading ? <Loader2 className="w-3.5 h-3.5 animate-spin" /> : <Wand2 className="w-3.5 h-3.5" />}
                          Process Text
                        </button>
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="sm:col-span-2"><label className="block text-slate-600 font-semibold mb-1">Client Name *</label><input type="text" required value={formData.clientName} onChange={(e) => setFormData({ ...formData, clientName: e.target.value })} className="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500" /></div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-600 font-semibold mb-1">Mobile Number</label>
                      <div className="flex shadow-sm rounded-lg">
                        <span className="inline-flex items-center px-3 rounded-l-lg border border-r-0 border-slate-300 bg-slate-50 text-slate-500 font-bold text-sm">
                          +91
                        </span>
                        <input 
                          type="tel" 
                          placeholder="9876543210" 
                          maxLength={10}
                          value={formData.mobile} 
                          onChange={(e) => setFormData({ ...formData, mobile: e.target.value.replace(/\D/g, '').slice(0, 10) })} 
                          className="flex-1 min-w-0 block w-full px-3 py-2.5 rounded-none rounded-r-lg border border-slate-300 focus:ring-indigo-500 focus:outline-none text-sm font-medium tracking-wide" 
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-600 font-semibold mb-1">Email Address</label>
                      <input type="email" value={formData.email} onChange={(e) => setFormData({ ...formData, email: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-600 font-semibold mb-1">PAN Number</label>
                      <input type="text" value={formData.pan} onChange={(e) => setFormData({ ...formData, pan: e.target.value.toUpperCase() })} className="w-full p-2.5 border border-slate-200 rounded-lg font-mono uppercase focus:ring-2 focus:ring-indigo-500" />
                    </div>
                    <div>
                      <label className="block text-slate-600 font-semibold mb-1">GSTIN Number</label>
                      <input type="text" value={formData.gstin} onChange={(e) => setFormData({ ...formData, gstin: e.target.value.toUpperCase() })} className="w-full p-2.5 border border-slate-200 rounded-lg font-mono uppercase focus:ring-2 focus:ring-indigo-500" />
                    </div>
                  </div>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                     <div>
                      <label className="block text-slate-600 font-semibold mb-1">Status</label>
                      <select value={formData.status} onChange={(e) => setFormData({ ...formData, status: e.target.value })} className="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="Active">Active</option>
                        <option value="Unspecified">Unspecified / Pending</option>
                      </select>
                    </div>
                    <div>
                      <label className="block text-slate-600 font-semibold mb-1">Constitution</label>
                      <select value={formData.constitution} onChange={(e) => setFormData({ ...formData, constitution: e.target.value })} className="w-full p-2.5 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                        <option value="">(Select Entity Type)</option>
                        <option value="Individual">Individual</option>
                        <option value="Proprietorship">Proprietorship</option>
                        <option value="Partnership">Partnership</option>
                        <option value="Private Limited">Private Limited</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-200 flex items-center justify-end space-x-2 pb-2">
                    <button type="button" onClick={() => setIsFormOpen(false)} className="px-4 py-2 border border-slate-200 rounded-lg text-slate-600 font-semibold">Cancel</button>
                    <button type="submit" className="px-5 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-sm">{editingClient ? 'Save Changes' : 'Create Client'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Delete Confirmation Modal */}
          {deleteCandidate && (
            <div className="fixed inset-0 z-[70] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 animate-in zoom-in-95 duration-200">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4"><Trash2 className="w-6 h-6" /></div>
                <h3 className="text-base font-bold text-slate-900 text-center">Delete Client Record?</h3>
                <div className="mt-6 flex items-center space-x-2">
                  <button onClick={() => setDeleteCandidate(null)} className="flex-1 py-2 border border-slate-200 rounded-lg text-xs font-semibold">Cancel</button>
                  <button onClick={confirmDelete} className="flex-1 py-2 bg-rose-600 text-white rounded-lg text-xs font-bold">Delete Client</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // 3. Wrapper Component to Connect with Google Apps Script
    function GASAppWrapper() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        // Automatically fetch data on load
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run
            .withSuccessHandler((res) => {
              setData(res);
              setLoading(false);
            })
            .withFailureHandler((err) => {
              console.error('GAS Error fetching data:', err);
              setLoading(false);
            })
            .getInitialData();
        } else {
          // Local Fallback (Mock Data) when not running in Apps Script
          console.warn('Google Apps Script not detected. Loading Mock Data.');
          setData([
            { index_: 1, row: ['ClientId', 'ClientName', 'Mobile', 'Email', 'LegalName', 'Constitution', 'Status', 'PAN', 'GSTIN', 'Adhar', 'Address', 'BranchId', 'Notes', 'FolderUrl', 'CreatedAt', 'UpdatedAt'] },
            { index_: 2, row: ['C40001', 'Acme Corporation Ltd', '9876543210', 'admin@acme.test', 'Acme Corporation Ltd', 'Private Limited', 'Active', 'ABCDE1234F', '29ABCDE1234F1Z5', '', '123 Business Rd', 'HQ', '', '', '2023-01-01', '2023-01-01'] },
            { index_: 3, row: ['C40002', 'John Doe Enterprises', '9998887776', 'johndoe@test.com', 'John Doe', 'Proprietorship', 'Unspecified', 'PANNOTREQD', 'N/A', '', '456 Side St', 'CMF', '', '', '2023-01-02', '2023-01-02'] }
          ]);
          setLoading(false);
        }
      }, []);

      const updateItem = (index, rowArray) => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.updateItem(index, rowArray);
        }
        setData(prev => prev.map(d => d.index_ === index ? { ...d, row: rowArray } : d));
      };

      const deleteItem = (index) => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          google.script.run.deleteItem(index);
        }
        setData(prev => prev.filter(d => d.index_ !== index));
      };

      const insertItem = (_, rowArray) => {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          // Call GAS, and on success, append the new item with the newly created row index
          google.script.run
            .withSuccessHandler((newIndex) => {
              setData(prev => [...prev, { index_: newIndex, row: rowArray }]);
            })
            .insertItem(null, rowArray);
        } else {
          // Local fallback mock update
          setData(prev => [...prev, { index_: Date.now(), row: rowArray }]);
        }
      };

      if (loading) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 gap-4">
            <div className="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-indigo-600"></div>
            <p className="text-slate-500 font-medium text-sm animate-pulse">Loading CRM Data from Google Sheets...</p>
          </div>
        );
      }

      return (
        <App 
          data={data} 
          updateItem={updateItem} 
          deleteItem={deleteItem} 
          insertItem={insertItem} 
        />
      );
    }

    // 4. Mount the React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GASAppWrapper />);
  </script>
</body>
</html>
