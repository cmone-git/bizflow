<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>bizodit - Appointments</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
</head>
<body>
<div class="module-container" id="appointment-module">

<style>
:root{
 --primary:#2563EB;--primary-light:#EFF6FF;--bg:#F8FAFC;--surface:#fff;
 --text-main:#0F172A;--text-muted:#64748B;--border:#E2E8F0;--grey-med:#CBD5E1;
 --shadow-sm:0 2px 8px rgba(15,23,42,.05);--success:#10B981;--danger:#EF4444;--secondary:#64748B;
}
#appointment-module{font-family:'Inter',sans-serif;width:100%;max-width:1120px}
#appointment-module *{box-sizing:border-box}
#appointment-module .section-title{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text-main);display:flex;justify-content:space-between;align-items:center}
#appointment-module .form-card{background:var(--surface);border-radius:20px;padding:24px;box-shadow:var(--shadow-sm);border:1px solid var(--border);margin-bottom:24px}
#appointment-module .form-label{display:block;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px;letter-spacing:.5px}
#appointment-module .input-group{display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px}
@media(min-width:768px){#appointment-module .input-group{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){#appointment-module .input-group.three-cols{grid-template-columns:1fr 1fr 1fr}#appointment-module .input-group.four-cols{grid-template-columns:1fr 1fr 1fr 1fr}}
#appointment-module .form-input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);font-size:14px;color:var(--text-main);background:#FAFAFA;outline:none;transition:border .2s;appearance:auto}
#appointment-module .form-input:focus{border-color:var(--primary);background:var(--surface)}
#appointment-module .btn-primary{background:var(--primary);color:#fff;border:none;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
#appointment-module .btn-primary:disabled{background:var(--grey-med);cursor:not-allowed}
#appointment-module .btn-outline{background:var(--surface);color:var(--text-main);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
#appointment-module .table-container{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-sm);border:1px solid var(--border);overflow:hidden;margin-bottom:24px}
#appointment-module .table-responsive{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
#appointment-module .table-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:16px}
#appointment-module .saas-table{width:100%;min-width:950px;border-collapse:collapse;text-align:left}
#appointment-module .saas-table th{padding:12px 16px;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;background:#FAFAFA;border-bottom:1px solid var(--border);white-space:nowrap}
#appointment-module .saas-table td{padding:16px;font-size:14px;font-weight:500;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
.badge{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;display:inline-block;white-space:nowrap;margin-right:4px}
.badge-pending{background:rgba(251,146,60,.1);color:#EA580C}.badge-reported{background:rgba(59,130,246,.1);color:#3B82F6}.badge-completed{background:rgba(16,185,129,.1);color:var(--success)}.badge-rescheduled{background:rgba(100,116,139,.1);color:var(--secondary)}.badge-cancelled{background:rgba(239,68,68,.1);color:#EF4444}.badge-category{background:rgba(15,23,42,.05);color:var(--text-main);border:1px solid var(--border)}
.cta-link{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:6px;background:#FAFAFA;border:1px solid var(--border);transition:.2s;text-decoration:none}
#reschedule-container,#bulk-reschedule-container{display:none}#reschedule-container.active,#bulk-reschedule-container.active{display:block;animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.notes-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;align-items:center;justify-content:center;padding:20px}.notes-modal-content{background:#fff;width:100%;max-width:600px;border-radius:12px;padding:24px;max-height:90vh;overflow-y:auto;box-shadow:0 10px 25px rgba(0,0,0,.2)}.notes-modal-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:16px}
@media print{body{background:#fff;padding:0}#sidebar-container,#header-container,#bottomnav-container,.form-card,.section-title,.no-print{display:none!important}.main-wrapper{flex:1;display:block;overflow:visible}#main-content{padding:0;overflow:visible}#appointment-module .table-container{box-shadow:none;border:none;margin:0}#appointment-module .table-header{padding:0 0 10px;border-bottom:2px solid #000}#appointment-module .saas-table{min-width:100%}#appointment-module .saas-table th{background:#fff;color:#000;border-bottom:1px solid #000}}
</style>

<div class="section-title"><h2 style="margin:0">Appointments & Scheduling</h2></div>

<div class="form-card no-print" id="aptFormCard">
<form id="add-appointment-form" onsubmit="event.preventDefault()">
<input type="hidden" id="aptDocId" value="">

<h4 style="color:var(--primary);margin:0 0 16px;border-bottom:1px solid var(--border);padding-bottom:8px">1. Patient Details</h4>
<div class="input-group"><div style="grid-column:1/-1"><label class="form-label" style="color:var(--primary)">Select / Search Patient (Auto-fills details below)</label><input list="patients-datalist" id="aptPatientSearch" class="form-input" placeholder="Search by Patient Name or Mobile" onchange="window.handlePatientSelect()" autocomplete="off" style="border-color:var(--primary);background:var(--primary-light)"><datalist id="patients-datalist"></datalist></div></div>

<div class="input-group four-cols">
<div><label class="form-label">Patient Mobile *</label><input type="tel" id="aptMobile" class="form-input" placeholder="10-digit number" maxlength="10" required></div>
<div><label class="form-label">Patient Name *</label><input type="text" id="aptName" class="form-input" placeholder="Full Name" required></div>
<div><label class="form-label">Age</label><input type="number" id="aptAge" class="form-input" placeholder="Years" min="1" max="120"></div>
<div><label class="form-label">Gender</label><select id="aptGender" class="form-input"><option value="">Select</option><option value="Male">Male</option><option value="Female">Female</option><option value="Other">Other</option></select></div>
</div>
<div class="input-group">
<div><label class="form-label">Patient Category *</label><select id="aptCategory" class="form-input" required><option value="Normal">Normal</option><option value="Regular">Regular</option><option value="Both">Both (Admin Mark)</option></select></div>
<div><label class="form-label">Patient Location</label><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn-outline" onclick="window.getCurrentLocation(this)" style="padding:14px 16px"><span class="material-symbols-rounded">my_location</span>Current</button><input type="text" id="aptLocation" class="form-input" placeholder="Address or Maps URL" style="flex:1;min-width:180px"><button type="button" class="btn-outline" onclick="window.openLocationMap()" style="padding:14px 16px"><span class="material-symbols-rounded">map</span>Map</button></div></div>
<div style="grid-column:1/-1"><label class="form-label">Patient Medical History / Admin Notes</label><textarea id="aptPatientNotes" class="form-input" rows="2" placeholder="Pre-existing conditions, allergies, patient background..."></textarea></div>
</div>

<h4 style="color:var(--primary);margin:24px 0 16px;border-bottom:1px solid var(--border);padding-bottom:8px">2. Appointment & Therapy Details</h4>
<div class="input-group three-cols">
<div><label class="form-label">Branch *</label><select id="aptBranch" class="form-input" required><option value="">Loading Branches...</option></select></div>
<div><label class="form-label">Scheduled Date *</label><input type="date" id="aptDate" class="form-input" required></div>
<div><label class="form-label">Scheduled Time *</label><input type="time" id="aptTime" class="form-input" required></div>
</div>
<div class="input-group three-cols">
<div><label class="form-label">Previous Visit Date</label><input type="date" id="aptPreviousDate" class="form-input"></div>
<div><label class="form-label">Previous Visit Time</label><input type="time" id="aptPreviousTime" class="form-input"></div>
<div><label class="form-label">Duration of Therapy</label><input type="text" id="aptDuration" class="form-input" placeholder="e.g. 30 minutes / 2 weeks"></div>
</div>
<div class="input-group three-cols">
<div><label class="form-label">Number of Sessions / Day</label><input type="number" id="aptSessionsPerDay" class="form-input" min="1" step="1" placeholder="e.g. 2"></div>
<div><label class="form-label">Doctor / Therapist Assigned *</label><input list="therapists-datalist" id="aptTherapist" class="form-input" placeholder="Search / Select Doctor..." required autocomplete="off"><datalist id="therapists-datalist"></datalist></div>
<div><label class="form-label">Appointment Status *</label><select id="aptStatus" class="form-input" onchange="window.toggleReschedule(this)" required><option value="Pending">Pending</option><option value="Reported">Reported</option><option value="Completed">Completed</option><option value="Rescheduled">Rescheduled</option><option value="Cancelled">Cancelled</option></select></div>
<div id="reschedule-container"><label class="form-label" style="color:var(--danger)">Pick New Reschedule Date</label><input type="date" id="aptRescheduleDate" class="form-input" style="border-color:var(--danger)"></div>
<div style="grid-column:1/-1"><label class="form-label">Diagnosis Report / Administrative Notes</label><textarea id="aptNotes" class="form-input" rows="3" placeholder="Diagnosis, symptoms, treatment findings, remarks..."></textarea></div>
</div>

<h4 style="color:var(--primary);margin:24px 0 16px;border-bottom:1px solid var(--border);padding-bottom:8px">3. Payment Details</h4>
<div class="input-group three-cols">
<div><label class="form-label">Payment Mode</label><select id="aptPaymentMode" class="form-input"><option value="Cash">Cash</option><option value="UPI">UPI</option><option value="Card">Card</option><option value="Bank Transfer">Bank Transfer</option><option value="Mixed">Mixed</option><option value="Credit">Credit</option></select></div>
<div><label class="form-label">Payment Reference / UTR</label><input type="text" id="aptPaymentReference" class="form-input" placeholder="Optional reference"></div>
<div><label class="form-label">Payment Remarks</label><input type="text" id="aptPaymentRemarks" class="form-input" placeholder="Optional payment notes"></div>
</div>
<div class="input-group" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));background:var(--bg);padding:16px;border-radius:12px;margin-top:8px">
<div><label class="form-label">Total Fee (₹)</label><input type="number" id="aptFee" class="form-input" placeholder="0.00" oninput="window.calcBalance()"></div>
<div><label class="form-label">Prev. Dues (OP) (₹)</label><input type="number" id="aptPrevDues" class="form-input" placeholder="0.00" readonly style="font-weight:700;color:var(--danger);background:transparent;border:none;padding-left:0"></div>
<div><label class="form-label">Advance Paid (₹)</label><input type="number" id="aptAdvance" class="form-input" placeholder="0.00" oninput="window.calcBalance()"></div>
<div><label class="form-label">Net Balance (₹)</label><input type="number" id="aptBalance" class="form-input" placeholder="0.00" readonly style="font-weight:700;color:var(--danger);background:transparent;border:none;padding-left:0"></div>
</div>
<div style="text-align:right;margin-top:24px"><button type="button" class="btn-outline" style="margin-right:12px;padding:14px 24px" onclick="window.resetAptForm()">Clear Form</button><button type="button" class="btn-primary" id="saveAptBtn" onclick="window.saveAppointment()">Save Appointment</button></div>
</form></div>

<div class="notes-modal-overlay" id="notesModal"><div class="notes-modal-content"><div class="notes-modal-header no-print"><h3 style="margin:0;color:var(--primary)">Patient Notes & Diagnosis</h3><button class="btn-outline" onclick="document.getElementById('notesModal').style.display='none'" style="padding:4px 8px;border:none"><span class="material-symbols-rounded">close</span></button></div><div id="printNotesArea"><h4 id="modalPatientName" style="margin-bottom:4px;font-size:18px">---</h4><p style="font-size:12px;color:var(--text-muted);margin-bottom:16px" id="modalPatientMeta">---</p><div style="background:#FAFAFA;border:1px solid var(--border);padding:16px;border-radius:8px;font-size:14px;line-height:1.6;white-space:pre-wrap;min-height:150px" id="modalPatientNotesText"></div></div><div class="no-print" style="margin-top:20px;text-align:right"><button class="btn-primary" onclick="window.printModalNotes()"><span class="material-symbols-rounded">print</span>Print Notes</button></div></div></div>

<div class="table-container"><div class="table-header">
<div style="display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px"><h4 style="margin:0">Schedule Directory</h4><div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn-outline no-print" onclick="window.executeBulkDelete()" style="border-color:var(--danger);color:var(--danger);padding:6px 12px;font-size:12px"><span class="material-symbols-rounded" style="font-size:14px">delete</span>Bulk Delete</button>
<button class="btn-outline no-print" onclick="window.openBulkReschedule()" style="border-color:var(--primary);color:var(--primary);padding:6px 12px;font-size:12px"><span class="material-symbols-rounded" style="font-size:14px">event_repeat</span>Move to Next Schedule</button>
<button class="btn-outline no-print" onclick="window.exportAptPDF()" style="padding:6px 12px;font-size:12px"><span class="material-symbols-rounded" style="font-size:14px;color:var(--primary)">picture_as_pdf</span>Export</button>
<button class="btn-outline no-print" onclick="window.downloadAppointmentSampleCSV()" style="padding:6px 12px;font-size:12px"><span class="material-symbols-rounded" style="font-size:14px">download</span>Sample CSV</button>
<button class="btn-outline no-print" onclick="document.getElementById('aptCsvInput').click()" style="padding:6px 12px;font-size:12px"><span class="material-symbols-rounded" style="font-size:14px">upload_file</span>Upload CSV</button>
<input id="aptCsvInput" type="file" accept=".csv,text/csv" class="no-print" style="display:none" onchange="window.importAppointmentsCSV(this.files[0])">
</div></div>
<div class="no-print" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:#FAFAFA;padding:12px;border-radius:8px;border:1px solid var(--border);width:100%">
<div style="display:flex;align-items:center;gap:6px"><input type="date" id="filterDateFrom" class="form-input" onchange="window.filterTable()" style="padding:8px;font-size:12px;width:auto"><span style="font-size:12px;color:var(--text-muted)">to</span><input type="date" id="filterDateTo" class="form-input" onchange="window.filterTable()" style="padding:8px;font-size:12px;width:auto"><button class="btn-outline" onclick="window.setFilterToday()" style="padding:8px 12px;font-size:12px">Today</button></div>
<select id="filterStatus" class="form-input" onchange="window.filterTable()" style="padding:8px;font-size:12px;width:auto"><option value="">All Statuses</option><option value="pending">Pending</option><option value="reported">Reported</option><option value="completed">Completed</option><option value="rescheduled">Rescheduled</option><option value="cancelled">Cancelled</option></select>
<select id="filterCategory" class="form-input" onchange="window.filterTable()" style="padding:8px;font-size:12px;width:auto"><option value="">All Categories</option><option value="normal">Normal</option><option value="regular">Regular</option><option value="both">Both</option></select>
<select id="filterPayment" class="form-input" onchange="window.filterTable()" style="padding:8px;font-size:12px;width:auto"><option value="">All Payments</option><option value="pending">Balance Pending</option><option value="paid">Fully Paid</option></select>
<select id="filterBranch" class="form-input" onchange="window.filterTable()" style="padding:8px;font-size:12px;width:auto"><option value="">Loading Branches...</option></select>
<div style="display:flex;align-items:center;background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px 8px;flex:1;min-width:200px"><span class="material-symbols-rounded" style="font-size:16px;color:var(--text-muted)">search</span><input type="text" id="aptSearchInput" onkeyup="window.filterTable()" placeholder="Search Name, Mobile, Doctor..." style="border:none;background:transparent;outline:none;font-size:12px;width:100%;margin-left:6px"></div>
<button class="btn-outline" onclick="window.clearFilters()" style="padding:8px;font-size:12px"><span class="material-symbols-rounded" style="font-size:16px">close</span></button></div></div>
<div id="bulk-reschedule-container" class="no-print" style="background:#fef5e8;padding:16px 20px;border-bottom:1px solid var(--border);align-items:center;gap:12px"><strong style="color:var(--primary);font-size:14px">Copy selected to:</strong><input type="date" id="bulkDateInput" class="form-input" style="width:auto;padding:8px 12px"><button class="btn-primary" style="padding:8px 16px" onclick="window.executeBulkReschedule()">Confirm Schedule</button><button class="btn-outline" style="padding:8px 16px;border:none;background:transparent" onclick="document.getElementById('bulk-reschedule-container').classList.remove('active')">Cancel</button></div>
<div class="table-responsive"><table class="saas-table"><thead><tr><th class="no-print"><input type="checkbox" onclick="window.toggleAllCheckboxes(this)" style="transform:scale(1.2)"></th><th>Date & Time</th><th>Patient Details</th><th>Branch / Doctor</th><th>Therapy / Financials</th><th>Status & Notes</th><th class="no-print" style="text-align:right">Actions</th></tr></thead><tbody id="aptTableBody"></tbody></table></div></div>

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
import { collection, addDoc, query, where, getDocs, updateDoc, doc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

window.deleteDoc=deleteDoc;window.doc=doc;window.appointmentsDataCache={};window.allBranchesString="";window.allPatientsCache={};

const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=v=>(parseFloat(v)||0).toFixed(2);

onAuthStateChanged(auth,user=>{
 if(!user){document.getElementById('appointment-module').innerHTML='<div style="text-align:center;padding:60px 20px;background:#FEF2F2;border-radius:16px;border:1px solid #FCA5A5;margin-top:20px"><span class="material-symbols-rounded" style="font-size:48px;color:#EF4444">gpp_bad</span><h2 style="color:#991B1B">Access Denied</h2><p>You must be logged into the administrative dashboard to view this module.</p></div>';return}
 if(window.currentUser&&window.currentUser.role!=='admin'){const b=document.querySelector('button[onclick="window.executeBulkDelete()"]');if(b)b.style.display='none'}
 window.loadPatientsForApt();window.loadBranchesForApt();window.loadTherapistsForApt();setMinBookingDate();window.loadAppointments().then(window.setFilterToday);
});

window.formatIndianDate=dateStr=>{if(!dateStr)return'';const p=String(dateStr).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:dateStr};
function setMinBookingDate(){const d=new Date(),s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;['aptDate','bulkDateInput','aptRescheduleDate'].forEach(id=>{const e=document.getElementById(id);if(e)e.min=s})}
window.openLocationMap=()=>{const loc=document.getElementById('aptLocation').value;if(!loc)return alert('Please paste a location link or address first.');window.open(loc.startsWith('http')?loc:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc),'_blank')};
window.getCurrentLocation=btn=>{if(!navigator.geolocation)return alert('Geolocation is not supported by this browser.');const old=btn.innerHTML;btn.innerHTML='<span class="material-symbols-rounded">sync</span> Wait...';navigator.geolocation.getCurrentPosition(p=>{document.getElementById('aptLocation').value=`https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;btn.innerHTML=old},()=>{alert('Error getting location.');btn.innerHTML=old})};

window.loadPatientsForApt=async()=>{const dl=document.getElementById('patients-datalist');if(!dl)return;try{let q=query(collection(db,'patients'));if(window.currentUser&&window.currentUser.role!=='admin')q=query(collection(db,'patients'),where('branch','==',window.currentUser.branch));const s=await getDocs(q);let h='';window.allPatientsCache={};s.forEach(d=>{const p=d.data();if(p.name&&p.mobile){window.allPatientsCache[p.mobile]=p;h+=`<option value="${esc(p.mobile)}" label="${esc(p.name)} (${esc(p.mobile)})"></option>`;h+=`<option value="${esc(p.name)} (${esc(p.mobile)})"></option>`}});dl.innerHTML=h}catch(e){console.error(e)}};

window.loadBranchesForApt=async()=>{const a=document.getElementById('aptBranch'),f=document.getElementById('filterBranch');if(window.currentUser&&window.currentUser.role!=='admin'){const b=window.currentUser.branch;a.innerHTML=`<option value="${esc(b)}">${esc(b)}</option>`;f.innerHTML=`<option value="${esc(b)}">${esc(b)}</option>`;a.style.pointerEvents=f.style.pointerEvents='none';a.style.background=f.style.background='var(--grey-med)';window.allBranchesString=b;return}try{const s=await getDocs(collection(db,'branches'));let l=[];s.forEach(d=>{if(d.data().name)l.push(d.data().name)});l.sort();window.allBranchesString=l.join(' | ');a.innerHTML='<option value="">Select Branch</option>'+l.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');f.innerHTML='<option value="">All Branches</option>'+l.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}catch(e){a.innerHTML='<option value="">Select Branch</option>'}};

window.loadTherapistsForApt=async()=>{const dl=document.getElementById('therapists-datalist');if(!dl)return;try{let q=query(collection(db,'therapists'));if(window.currentUser&&window.currentUser.role!=='admin')q=query(collection(db,'therapists'),where('branch','==',window.currentUser.branch));const s=await getDocs(q);let l=[];s.forEach(d=>{if(d.data().name)l.push(d.data().name)});dl.innerHTML=l.sort().map(x=>`<option value="${esc(x)}"></option>`).join('')}catch(e){console.error(e)}};

function isPastDateTime(ds,ts){if(!ds)return false;const [y,m,d]=ds.split('-').map(Number),[h=0,mi=0]=String(ts||'00:00').split(':').map(Number);return new Date(y,m-1,d,h,mi)<new Date()}
window.toggleReschedule=s=>{const c=document.getElementById('reschedule-container');if(s.value==='Rescheduled')c.classList.add('active');else{c.classList.remove('active');document.getElementById('aptRescheduleDate').value=''}};
window.calcBalance=()=>{const fee=parseFloat(document.getElementById('aptFee').value)||0,adv=parseFloat(document.getElementById('aptAdvance').value)||0,prev=parseFloat(document.getElementById('aptPrevDues').value)||0;document.getElementById('aptBalance').value=(fee+prev-adv).toFixed(2)};

/* ---------------- CSV SAMPLE / BULK APPOINTMENT IMPORT ---------------- */
const CSV_HEADERS=[
 'mobile','name','age','gender','category','location','patientNotes',
 'branch','date','time','previousDate','previousTime','duration','sessionsPerDay',
 'therapist','status','fee','advance','prevDues','notes',
 'paymentMode','paymentReference','paymentRemarks'
];

function parseCSV(text){
 const rows=[];let row=[],cell='',quoted=false;
 text=String(text||'').replace(/^\uFEFF/,'');
 for(let i=0;i<text.length;i++){
   const ch=text[i];
   if(quoted){
     if(ch==='"'){
       if(text[i+1]==='"'){cell+='"';i++}else quoted=false;
     }else cell+=ch;
   }else{
     if(ch==='"') quoted=true;
     else if(ch===','){row.push(cell);cell=''}
     else if(ch==='\n'){
       row.push(cell);rows.push(row);row=[];cell='';
     }else if(ch!=='\r') cell+=ch;
   }
 }
 if(cell!==''||row.length){row.push(cell);rows.push(row)}
 return rows.filter(r=>r.some(v=>String(v||'').trim()!==''));
}

function normalizeCSVHeader(v){
 return String(v||'').trim().replace(/^\uFEFF/,'').toLowerCase().replace(/[\s_\-\/]+/g,'');
}

function csvValue(obj,key){return String(obj[key]??'').trim()}

window.downloadAppointmentSampleCSV=()=>{
 const sample=[
   CSV_HEADERS,
   ['9744902555','Abdulla P.V.','63','Male','Normal','','Stroke patient','Mahe','2026-09-06','10:30','2026-09-05','10:00','30 minutes','2','Dr. Thejaswi M.K','Pending','1000','500','0','Continue physiotherapy','UPI','123456789012','']
 ];
 const csv=sample.map(r=>r.map(v=>{
   const s=String(v??'');
   return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
 }).join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='appointments-sample.csv';
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

function validISODate(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v+'T00:00:00').getTime())}
function validTime(v){return /^\d{2}:\d{2}$/.test(v)&&Number(v.slice(0,2))<24&&Number(v.slice(3,5))<60}

window.importAppointmentsCSV=async file=>{
 const input=document.getElementById('aptCsvInput');
 if(!file){if(input)input.value='';return}
 if(!/\.csv$/i.test(file.name)){alert('Please select a CSV file.');if(input)input.value='';return}
 try{
   const text=await file.text();
   const rows=parseCSV(text);
   if(rows.length<2)throw new Error('CSV contains no appointment rows.');
   const rawHeaders=rows[0];
   const headerMap={};
   rawHeaders.forEach((h,i)=>headerMap[normalizeCSVHeader(h)]=i);

   const required=['mobile','name','branch','date','time','therapist'];
   const missing=required.filter(h=>headerMap[normalizeCSVHeader(h)]===undefined);
   if(missing.length)throw new Error('Missing required CSV columns: '+missing.join(', '));

   const records=rows.slice(1).map((r,ri)=>{
     const o={};
     CSV_HEADERS.forEach(k=>{
       const idx=headerMap[normalizeCSVHeader(k)];
       o[k]=idx===undefined?'':String(r[idx]??'').trim();
     });
     o._row=ri+2;
     return o;
   });

   const failures=[];
   let imported=0;

   for(const r of records){
     try{
       const mobile=r.mobile.replace(/\D/g,'');
       if(!/^\d{10}$/.test(mobile))throw new Error('Mobile must be 10 digits.');
       if(!r.name)throw new Error('Patient name is required.');
       if(!r.branch)throw new Error('Branch is required.');
       if(!r.date||!validISODate(r.date))throw new Error('Date must be YYYY-MM-DD.');
       if(!r.time||!validTime(r.time))throw new Error('Time must be HH:MM.');
       if(!r.therapist)throw new Error('Doctor / Therapist is required.');
       if(!window.currentUser||window.currentUser.role!=='admin'){
         if(r.branch!==window.currentUser.branch)throw new Error('Branch does not match your assigned branch.');
       }
       if(isPastDateTime(r.date,r.time))throw new Error('Cannot import an appointment in the past.');

       const category=r.category||'Normal';
       const status=r.status||'Pending';
       const fee=parseFloat(r.fee)||0;
       const advance=parseFloat(r.advance)||0;
       const prevDues=parseFloat(r.prevDues)||0;
       const balance=fee+prevDues-advance;

       const payload={
         mobile,name:r.name,age:r.age,gender:r.gender,category,
         location:r.location,patientNotes:r.patientNotes,branch:r.branch,
         date:r.date,time:r.time,previousDate:r.previousDate,previousTime:r.previousTime,
         duration:r.duration,sessionsPerDay:r.sessionsPerDay,therapist:r.therapist,
         status,fee,advance,balance,prevDues,notes:r.notes,
         paymentMode:r.paymentMode||'Cash',
         paymentReference:r.paymentReference,
         paymentRemarks:r.paymentRemarks,
         createdAt:new Date(),updatedAt:new Date()
       };

       let pq=query(collection(db,'patients'),where('mobile','==',mobile));
       if(window.currentUser&&window.currentUser.role!=='admin'){
         pq=query(collection(db,'patients'),where('mobile','==',mobile),where('branch','==',window.currentUser.branch));
       }
       const ps=await getDocs(pq);
       const pdata={
         mobile,name:r.name,age:r.age,gender:r.gender,category,
         location:r.location,notes:r.patientNotes,branch:r.branch
       };
       if(ps.empty){
         await addDoc(collection(db,'patients'),{
           patientId:'P'+Math.floor(Math.random()*90000+10000),
           ...pdata,createdAt:new Date()
         });
       }else{
         await updateDoc(doc(db,'patients',ps.docs[0].id),pdata);
       }

       const n=await addDoc(collection(db,'appointments'),payload);
       try{
         await window.syncTransactions(n.id,payload);
       }catch(txErr){
         console.error('Transaction sync failed for imported row',r._row,txErr);
       }
       imported++;
     }catch(e){
       console.error('CSV row '+r._row,e);
       failures.push('Row '+r._row+': '+(e.message||'Import failed'));
     }
   }

   let msg=`CSV import complete.\n\nImported: ${imported}\nFailed: ${failures.length}`;
   if(failures.length)msg+=`\n\n${failures.slice(0,15).join('\n')}${failures.length>15?'\n...':''}`;
   alert(msg);
   if(imported)await window.loadAppointments();
 }catch(e){
   console.error(e);
   alert('CSV import failed: '+(e.message||'Invalid CSV file.'));
 }finally{
   if(input)input.value='';
 }
};

window.exportAptPDF=()=>window.print();
</script>
