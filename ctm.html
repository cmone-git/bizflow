<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <base target="_top"> <!-- Required for Google Apps Script routing -->
  <title>ClientHub CRM</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script>window.react = window.React;</script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  
  <!-- Lucide React Icons -->
  <script src="https://unpkg.com/lucide-react@0.284.0/dist/umd/lucide-react.min.js" crossorigin></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- Boot Logger & Crash Reporter (Visible if compilation fails) -->
  <div id="boot-log" style="padding: 20px; font-family: sans-serif; text-align: center; margin-top: 20vh;">
    <div style="display: inline-block; width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <h3 style="color: #1e1e2f; margin-top: 20px;">Booting ClientHub...</h3>
    <p style="color: #64748b; font-size: 14px;">Compiling Interface Engine</p>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>
  
  <div id="error-log" style="color: #dc2626; padding: 20px; font-family: monospace; font-size: 13px; font-weight: bold;"></div>
  
  <!-- Mount point for React -->
  <div id="root"></div>

  <!-- Global Error Handler -->
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      document.getElementById('boot-log').style.display = 'none';
      document.getElementById('error-log').innerHTML += `<p>💥 CRASH REPORT:<br/>${message}<br/>Line: ${lineno}:${colno}</p>`;
      return false; 
    };
  </script>

  <script type="text/babel">
    // Hide boot logger...
    
    // Your React application code
    ...
    
    root.render(<GASAppWrapper />);
</script>

</body>
</html>
</body>
</html>
