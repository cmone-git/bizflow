<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - CM FILINGS</title>
    
    <!-- PWA & Favicon Assets -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#071D49">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#B10000',
                            redhover: '#8A0000',
                            redlight: '#FDF2F2',
                            navy: '#071D49',
                            navyhover: '#102a5c',
                            light: '#F4F5F7',
                            white: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .hero-pattern {
            background-color: #F4F5F7;
            background-image: radial-gradient(rgba(7, 29, 73, 0.05) 1px, transparent 1px);
            background-size: 28px 28px;
        }
    </style>
</head>
<body class="font-sans text-slate-700 bg-brand-light antialiased selection:bg-brand-redlight selection:text-brand-red flex flex-col min-h-screen">

    <!-- MAIN SIGNUP CONTAINER -->
    <div class="flex-1 hero-pattern flex flex-col items-center justify-center p-4 min-h-screen">
        <div class="bg-white p-8 md:p-10 rounded-3xl shadow-xl border border-slate-200 w-full max-w-md">
            
            <div class="flex flex-col items-center mb-6 text-center">
                <div class="w-14 h-14 bg-brand-navy rounded-2xl flex items-center justify-center text-white shadow-sm mb-3">
                    <i data-lucide="user-plus" class="w-7 h-7"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-brand-navy tracking-tight">Create Account</h1>
                <p class="text-[10px] font-bold text-brand-red uppercase tracking-widest mt-1">Register New User Profile</p>
            </div>

            <!-- Error Notification Banner -->
            <div id="auth-error" class="hidden bg-brand-redlight text-brand-red text-xs font-bold p-3 rounded-xl border border-brand-red/20 mb-4 text-center"></div>
            
            <!-- Success Notification Banner -->
            <div id="auth-success" class="hidden bg-emerald-50 text-emerald-600 text-xs font-bold p-3 rounded-xl border border-emerald-200 mb-4 text-center"></div>

            <!-- SIGN UP FORM -->
            <form id="signup-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Full Name *</label>
                    <input type="text" id="signup-name" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-navy outline-none transition-all bg-slate-50 font-medium text-slate-800 text-xs" placeholder="John Doe">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Mobile Number (10 Digits) *</label>
                    <input type="tel" id="signup-mobile" required pattern="[0-9]{10}" maxlength="10" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-navy outline-none transition-all bg-slate-50 font-medium text-slate-800 text-xs font-mono" placeholder="9876543210">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Email ID *</label>
                    <input type="email" id="signup-email" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:border-brand-navy outline-none transition-all bg-slate-50 font-medium text-slate-800 text-xs" placeholder="name@example.com">
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Password *</label>
                    <div class="relative">
                        <input type="password" id="signup-password" required minlength="6" class="w-full px-4 py-3 pr-10 rounded-xl border border-slate-300 focus:border-brand-navy outline-none transition-all bg-slate-50 font-medium text-slate-800 text-xs" placeholder="Min 6 characters">
                        <button type="button" id="btn-toggle-password" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600 transition-colors" title="Toggle Password">
                            <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <!-- Optional Profile Picture Upload (Firebase Storage Demo) -->
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Profile Picture (Optional)</label>
                    <input type="file" id="signup-profile-pic" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-100 file:text-brand-navy hover:file:bg-slate-200 transition-all border border-slate-300 rounded-xl cursor-pointer bg-slate-50 p-1">
                </div>

                <button type="submit" id="btn-submit" class="w-full py-3.5 bg-brand-red text-white font-bold rounded-xl shadow-[0_8px_20px_rgb(177,0,0,0.2)] hover:bg-brand-redhover transition-colors flex items-center justify-center gap-2 mt-2 text-xs">
                    <i data-lucide="user-check" class="w-4 h-4"></i> Complete Registration
                </button>
            </form>

            <div class="mt-6 text-center text-xs text-slate-500">
                Already have an account? <a href="signin.html" class="font-bold text-brand-navy hover:underline">Sign In</a>
            </div>
        </div>

        <div class="mt-8 text-center text-xs font-medium text-slate-400">
            &copy; 2026 CM Filings. All rights reserved.
        </div>
    </div>

    <!-- FIREBASE & SIGNUP LOGIC SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

        // ==========================================
        // ADD YOUR FIREBASE CONFIG HERE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCXyKSTlmlzkYnH2LW408cVVWV1CPvlfBo",
            authDomain: "cmfilings-6a37c.firebaseapp.com",
            projectId: "cmfilings-6a37c",
            storageBucket: "cmfilings-6a37c.firebasestorage.app",
            messagingSenderId: "138705123778",
            appId: "1:138705123778:web:9561bff9f0f5d89bb6fe5b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        lucide.createIcons();

        const signupForm = document.getElementById('signup-form');
        const inputName = document.getElementById('signup-name');
        const inputMobile = document.getElementById('signup-mobile');
        const inputEmail = document.getElementById('signup-email');
        const inputPassword = document.getElementById('signup-password');
        const inputProfilePic = document.getElementById('signup-profile-pic');
        
        const btnSubmit = document.getElementById('btn-submit');
        const authError = document.getElementById('auth-error');
        const authSuccess = document.getElementById('auth-success');
        
        const btnTogglePassword = document.getElementById('btn-toggle-password');

        // Toggle password visibility
        btnTogglePassword.addEventListener('click', () => {
            if (inputPassword.type === 'password') {
                inputPassword.type = 'text';
                btnTogglePassword.innerHTML = `<i data-lucide="eye-off" class="w-4 h-4"></i>`;
            } else {
                inputPassword.type = 'password';
                btnTogglePassword.innerHTML = `<i data-lucide="eye" class="w-4 h-4"></i>`;
            }
            lucide.createIcons();
        });

        // Signup Form Handler
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = inputName.value.trim();
            const mobile = inputMobile.value.trim();
            const email = inputEmail.value.trim();
            const password = inputPassword.value;
            const file = inputProfilePic.files[0];

            if (mobile.length !== 10) {
                authError.textContent = "Please enter a valid 10-digit mobile number.";
                authError.classList.remove('hidden');
                return;
            }

            const originalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin inline"></i> Creating Account...`;
            authError.classList.add('hidden');
            authSuccess.classList.add('hidden');
            lucide.createIcons();

            try {
                // 1. Create Authentication User
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                let profilePicUrl = "";

                // 2. Upload Profile Picture to Firebase Storage if selected
                if (file) {
                    const storageRef = ref(storage, `profile_pictures/${uid}_${file.name}`);
                    const snapshot = await uploadBytes(storageRef, file);
                    profilePicUrl = await getDownloadURL(snapshot.ref);
                }

                // 3. Save User Metadata in Firestore
                const userData = {
                    uid: uid,
                    name: name,
                    mobile: mobile,
                    email: email,
                    profilePicUrl: profilePicUrl,
                    createdAt: new Date().toISOString()
                };

                await setDoc(doc(db, "users", uid), userData);

                authSuccess.textContent = "Registration successful! Redirecting...";
                authSuccess.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = "signin.html";
                }, 1500);

            } catch (err) {
                console.error("Signup error:", err);
                authError.textContent = err.message || "Failed to create account. Please try again.";
                authError.classList.remove('hidden');
                btnSubmit.innerHTML = originalText;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
