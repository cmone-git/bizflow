<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Contacts - CM FILINGS</title>
    
    <!-- PWA & Favicon Assets -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#071D49">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#B10000',
                            redhover: '#8A0000',
                            redlight: '#FDF2F2',
                            navy: '#071D49',
                            navyhover: '#102a5c',
                            light: '#F4F5F7',
                            white: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; }
        .hero-pattern {
            background-color: #F4F5F7;
            background-image: radial-gradient(rgba(7, 29, 73, 0.05) 1px, transparent 1px);
            background-size: 28px 28px;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="font-sans text-slate-700 bg-brand-light antialiased selection:bg-brand-redlight selection:text-brand-red flex flex-col min-h-screen">

    <!-- APP LOADER -->
    <div id="app-loader" class="fixed inset-0 bg-brand-light z-[100] flex flex-col items-center justify-center">
        <i data-lucide="loader-2" class="w-10 h-10 text-brand-navy animate-spin mb-4"></i>
        <p class="text-sm font-bold text-slate-500 tracking-widest uppercase">Loading Contacts...</p>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="hidden flex-col min-h-screen">
        
        <!-- HEADER -->
        <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
            <div class="max-w-3xl mx-auto px-4">
                <div class="flex justify-between items-center h-16">
                    <a href="dashboard.html" class="flex items-center gap-2.5 group">
                        <div class="w-9 h-9 bg-brand-navy rounded-xl flex items-center justify-center text-white shadow-sm">
                            <i data-lucide="phone-call" class="w-4 h-4"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="font-extrabold text-base tracking-tight text-brand-navy leading-none">CM FILINGS</span>
                            <span class="text-[8px] font-bold text-brand-red uppercase tracking-widest leading-none mt-1">Quick Contacts</span>
                        </div>
                    </a>
                    
                    <span class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1.5 rounded-full" id="contact-count">0 Contacts</span>
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="flex-1 hero-pattern py-6">
            <div class="max-w-3xl mx-auto px-4 space-y-4">
                
                <!-- STICKY SEARCH TOOLBAR -->
                <div class="sticky top-20 z-40 bg-white/95 backdrop-blur-md p-3 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                        <input type="text" id="search-input" placeholder="Search by name, ID, or mobile number..." class="w-full text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 outline-none focus:border-brand-navy transition-all">
                    </div>
                </div>

                <!-- FAST SCROLLING CONTACTS CONTAINER -->
                <div id="contacts-list" class="space-y-2.5 pb-12">
                    <div class="p-8 text-center text-slate-400 font-medium">Loading client phone directory...</div>
                </div>

            </div>
        </main>

        <!-- FOOTER -->
        <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
            <div class="max-w-3xl mx-auto px-4 text-center text-xs font-medium text-slate-400">
                &copy; 2026 CM Filings. Mobile Communications Directory.
            </div>
        </footer>
    </div>

    <!-- FIREBASE & LOGIC SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXyKSTlmlzkYnH2LW408cVVWV1CPvlfBo",
            authDomain: "cmfilings-6a37c.firebaseapp.com",
            projectId: "cmfilings-6a37c",
            storageBucket: "cmfilings-6a37c.firebasestorage.app",
            messagingSenderId: "138705123778",
            appId: "1:138705123778:web:9561bff9f0f5d89bb6fe5b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        lucide.createIcons();

        const appLoader = document.getElementById('app-loader');
        const mainApp = document.getElementById('main-app');
        const contactsList = document.getElementById('contacts-list');
        const searchInput = document.getElementById('search-input');
        const contactCount = document.getElementById('contact-count');

        let allClients = [];

        // Real-time Firestore Sync
        onSnapshot(collection(db, 'clients'), (snapshot) => {
            appLoader.classList.add('hidden');
            mainApp.classList.replace('hidden', 'flex');

            allClients = [];
            snapshot.forEach(docSnap => {
                allClients.push({ id: docSnap.id, ...docSnap.data() });
            });

            // Default sort alphabetically by name
            allClients.sort((a, b) => {
                const nameA = (a.clientName || a.name || '').toLowerCase();
                const nameB = (b.clientName || b.name || '').toLowerCase();
                return nameA.localeCompare(nameB);
            });

            renderContacts(allClients);
        });

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim().toLowerCase();
            const filtered = allClients.filter(c => {
                const name = (c.clientName || c.name || '').toLowerCase();
                const cId = (c.clientId || c.id || '').toLowerCase();
                const mobile = (c.mobile || c.phone || '').toLowerCase();
                return name.includes(query) || cId.includes(query) || mobile.includes(query);
            });
            renderContacts(filtered);
        });

        function renderContacts(clients) {
            contactsList.innerHTML = '';
            contactCount.textContent = `${clients.length} Contacts`;

            if (clients.length === 0) {
                contactsList.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 font-medium border border-slate-200">No matching contacts found.</div>`;
                return;
            }

            clients.forEach(client => {
                const name = client.clientName || client.name || 'Unnamed Client';
                const cId = client.clientId || client.id || '---';
                const mobile = client.mobile || client.phone || '';

                const waText = encodeURIComponent(`Hello ${name},\n\nGreetings from CM Filings! 🙏\n\n`);
                const waLink = mobile ? `https://wa.me/91${mobile}?text=${waText}` : '#';
                const callLink = mobile ? `tel:${mobile}` : '#';

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between gap-3 hover:border-brand-navy transition-all";
                
                card.innerHTML = `
                    <div class="space-y-1 min-w-0 flex-1">
                        <div class="flex items-center gap-2">
                            <h4 class="font-extrabold text-brand-navy text-sm truncate">${name}</h4>
                        </div>
                        <div class="flex items-center gap-3 text-xs font-mono">
                            <span class="text-brand-red font-bold">ID: ${cId}</span>
                            <span class="text-slate-500 font-semibold">${mobile || '<span class="text-slate-300 italic">No Mobile</span>'}</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 shrink-0">
                        ${mobile ? `
                            <a href="${callLink}" class="p-3 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-xl border border-emerald-200 transition-all flex items-center justify-center" title="Call ${name}">
                                <i data-lucide="phone" class="w-4 h-4 pointer-events-none"></i>
                            </a>
                            <a href="${waLink}" target="_blank" class="p-3 bg-green-50 text-[#25D366] hover:bg-green-100 rounded-xl border border-green-200 transition-all flex items-center justify-center" title="WhatsApp ${name}">
                                <i data-lucide="message-circle" class="w-4 h-4 pointer-events-none"></i>
                            </a>
                        ` : `
                            <button disabled class="p-3 bg-slate-100 text-slate-300 rounded-xl border border-slate-200 cursor-not-allowed" title="No Number"><i data-lucide="phone-off" class="w-4 h-4"></i></button>
                        `}
                    </div>
                `;
                contactsList.appendChild(card);
            });

            lucide.createIcons();
        }
    </script>
</body>
</html>
