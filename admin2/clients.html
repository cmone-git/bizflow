<body class="font-sans text-slate-700 bg-brand-light antialiased selection:bg-brand-redlight selection:text-brand-red flex flex-col min-h-screen">

    <!-- APP LOADER -->

    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="hidden flex-col min-h-screen">
        
        <!-- NAVIGATION WITH HEADER ADD BUTTON -->
        <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-20">
                    <div class="flex items-center gap-4">
                        <a href="index.html" class="flex items-center gap-3 group border-r border-slate-200 pr-4">

                                <i data-lucide="users" class="w-5 h-5"></i>

                            <div class="flex flex-col">

        <!-- MAIN CONTENT -->
        <main class="flex-1 hero-pattern py-8 relative">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 relative z-10">
                
                <!-- KPI CARD -->

                <!-- DIRECTORY CONTAINER -->
                <div class="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                        <h3 class="text-lg font-bold text-brand-navy flex items-center gap-2">

                        <!-- FILTERS -->

        <!-- ADD / EDIT CLIENT MODAL -->
        <div id="client-modal" class="hidden fixed inset-0 bg-brand-navy/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-lg w-full shadow-2xl border border-slate-200 animate-in zoom-in-95 duration-200">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="modal-title" class="text-lg font-bold text-brand-navy">Add New Client</h3>
                    <button id="btn-close-modal" class="text-slate-400 hover:text-brand-red"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                
                <form id="client-form" class="space-y-4 max-h-[70vh] overflow-y-auto pr-1">
                    <input type="hidden" id="form-firebase-id">
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Client ID</label>
                            <input type="text" id="form-client-id" placeholder="e.g. CLI001" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-mono font-bold uppercase outline-none bg-white">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Status</label>
                            <select id="form-status" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-bold outline-none bg-white">
                                <option value="Active">Active</option>
                                <option value="Regular">Regular</option>
                                <option value="Non Active">Non Active</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Client Name *</label>
                        <input type="text" id="form-client-name" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-bold outline-none bg-white" placeholder="Full Name or Business Name">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider">Mobile (10 Digits) *</label>
                                <button type="button" id="btn-pick-contact" class="text-[10px] font-bold text-brand-red hover:underline flex items-center gap-1">
                                    <i data-lucide="contact" class="w-3 h-3"></i> Pick Contact
                                </button>
                            </div>
                            <input type="tel" id="form-mobile" required pattern="[0-9]{10}" maxlength="10" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-mono font-bold outline-none bg-white" placeholder="9876543210">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Email</label>
                            <input type="email" id="form-email" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs outline-none bg-white" placeholder="client@email.com">
                        </div>
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">PAN</label>
                            <input type="text" id="form-pan" maxlength="10" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-mono uppercase outline-none bg-white" placeholder="PAN">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Adhaar</label>
                            <input type="text" id="form-adhar" maxlength="12" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-mono outline-none bg-white" placeholder="Adhaar">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">GSTIN</label>
                            <input type="text" id="form-gstin" maxlength="15" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs font-mono uppercase outline-none bg-white" placeholder="GST">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Address</label>
                        <textarea id="form-address" rows="2" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-xs outline-none bg-white resize-none" placeholder="Client street address..."></textarea>
                    </div>

                    <button type="submit" id="btn-save-client" class="w-full py-3.5 bg-brand-navy text-white font-bold rounded-xl shadow-md hover:bg-brand-navyhover transition-colors flex items-center justify-center gap-2 mt-4 text-xs">
                        Save Client Profile
                    </button>
                </form>
            </div>
        </div>

        <!-- VIEW DETAILS MODAL -->
        <div id="view-modal" class="hidden fixed inset-0 bg-brand-navy/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border border-slate-200 animate-in zoom-in-95 duration-200">
                <div class="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                    <div>
                        <h3 id="view-name" class="text-lg font-extrabold text-brand-navy">Client Name</h3>
                        <p class="text-xs font-mono text-brand-red font-bold" id="view-id">ID: ---</p>
                    </div>
                    <button id="btn-close-view" class="text-slate-400 hover:text-brand-red"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                
                <div class="space-y-3 text-xs">
                    <div class="flex justify-between py-1.5 border-b border-slate-50"><span class="font-bold text-slate-400">Mobile:</span> <span id="view-mobile" class="font-mono font-semibold">---</span></div>
                    <div class="flex justify-between py-1.5 border-b border-slate-50"><span class="font-bold text-slate-400">Email:</span> <span id="view-email" class="font-medium">---</span></div>
                    <div class="flex justify-between py-1.5 border-b border-slate-50"><span class="font-bold text-slate-400">PAN:</span> <span id="view-pan" class="font-mono font-semibold uppercase">---</span></div>
                    <div class="flex justify-between py-1.5 border-b border-slate-50"><span class="font-bold text-slate-400">Adhaar:</span> <span id="view-adhar" class="font-mono font-semibold">---</span></div>
                    <div class="flex justify-between py-1.5 border-b border-slate-50"><span class="font-bold text-slate-400">GSTIN:</span> <span id="view-gstin" class="font-mono font-semibold uppercase">---</span></div>
                    <div class="flex justify-between py-1.5 border-b border-slate-50"><span class="font-bold text-slate-400">Status:</span> <span id="view-status" class="font-bold">---</span></div>
                    <div class="pt-2"><span class="block font-bold text-slate-400 mb-1">Address:</span> <p id="view-address" class="text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100">---</p></div>
                </div>

                <div class="flex gap-3 mt-6">
                    <button id="btn-modal-edit" class="flex-1 py-3 bg-brand-navy text-white font-bold rounded-xl shadow-sm hover:bg-brand-navyhover transition-colors text-xs flex items-center justify-center gap-1.5">
                        <i data-lucide="edit-2" class="w-3.5 h-3.5"></i> Edit Profile
                    </button>
                    <button id="btn-modal-delete" class="flex-1 py-3 bg-red-50 text-brand-red font-bold rounded-xl shadow-sm hover:bg-red-100 transition-colors text-xs flex items-center justify-center gap-1.5 border border-brand-red/20">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete Client
                    </button>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="bg-white border-t border-slate-200 pt-8 pb-8 mt-auto">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center text-xs font-medium text-slate-500">
                <p>&copy; 2026 CM Filings. Client Portal.</p>
                <div class="flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 text-brand-red"></i> Secure Portal</div>
            </div>
        </footer>
    </div>

    <!-- FIREBASE & LOGIC SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCXyKSTlmlzkYnH2LW408cVVWV1CPvlfBo",
            authDomain: "cmfilings-6a37c.firebaseapp.com",
            projectId: "cmfilings-6a37c",
            storageBucket: "cmfilings-6a37c.firebasestorage.app",
            messagingSenderId: "138705123778",
            appId: "1:138705123778:web:9561bff9f0f5d89bb6fe5b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        lucide.createIcons();

        const appLoader = document.getElementById('app-loader');
        const mainApp = document.getElementById('main-app');
        const listContainer = document.getElementById('clients-list-container');
        const kpiTotalClients = document.getElementById('kpi-total-clients');
        
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');

        // Modal Elements
        const clientModal = document.getElementById('client-modal');
        const modalTitle = document.getElementById('modal-title');
        const btnOpenAddModal = document.getElementById('btn-open-add-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const clientForm = document.getElementById('client-form');
        
        const formFirebaseId = document.getElementById('form-firebase-id');
        const formClientId = document.getElementById('form-client-id');
        const formClientName = document.getElementById('form-client-name');
        const formMobile = document.getElementById('form-mobile');
        const formEmail = document.getElementById('form-email');
        const formPan = document.getElementById('form-pan');
        const formAdhar = document.getElementById('form-adhar');
        const formGstin = document.getElementById('form-gstin');
        const formAddress = document.getElementById('form-address');
        const formStatus = document.getElementById('form-status');
        const btnSaveClient = document.getElementById('btn-save-client');
        const btnPickContact = document.getElementById('btn-pick-contact');

        // View Modal Elements
        const viewModal = document.getElementById('view-modal');
        const btnCloseView = document.getElementById('btn-close-view');
        const viewName = document.getElementById('view-name');
        const viewId = document.getElementById('view-id');
        const viewMobile = document.getElementById('view-mobile');
        const viewEmail = document.getElementById('view-email');
        const viewPan = document.getElementById('view-pan');
        const viewAdhar = document.getElementById('view-adhar');
        const viewGstin = document.getElementById('view-gstin');
        const viewStatus = document.getElementById('view-status');
        const viewAddress = document.getElementById('view-address');
        const btnModalEdit = document.getElementById('btn-modal-edit');
        const btnModalDelete = document.getElementById('btn-modal-delete');

        let allClientsData = [];
        let clientsMap = {};
        let activeViewFirebaseId = null;

        // Load Data from Firestore
        onSnapshot(collection(db, 'clients'), (snapshot) => {
            appLoader.classList.add('hidden');
            mainApp.classList.replace('hidden', 'flex');

            allClientsData = [];
            clientsMap = {};

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const item = { firebaseId: docSnap.id, ...data };
                allClientsData.push(item);
                clientsMap[docSnap.id] = item;
            });

            filterAndRenderClients();
        });

        searchInput.addEventListener('input', filterAndRenderClients);
        sortSelect.addEventListener('change', filterAndRenderClients);

        function filterAndRenderClients() {
            const searchVal = searchInput.value.trim().toLowerCase();
            const sortVal = sortSelect.value;

            let filtered = allClientsData.filter(c => {
                const name = (c.clientName || c.ClientName || c.name || '').toLowerCase();
                const id = (c.clientId || c.ClientId || '').toLowerCase();
                const pan = (c.pan || c.Pan || '').toLowerCase();
                const gstin = (c.gstin || c.Gstin || '').toLowerCase();
                const mobile = (c.mobile || c.Mobile || '').toLowerCase();

                return name.includes(searchVal) || id.includes(searchVal) || pan.includes(searchVal) || gstin.includes(searchVal) || mobile.includes(searchVal);
            });

            filtered.sort((a, b) => {
                const nameA = (a.clientName || a.ClientName || a.name || '').toLowerCase();
                const nameB = (b.clientName || b.ClientName || b.name || '').toLowerCase();
                const idA = (a.clientId || a.ClientId || '').toLowerCase();
                const idB = (b.clientId || b.ClientId || '').toLowerCase();
                const dateA = new Date(a.createdAt || a.CreatedAt || 0);
                const dateB = new Date(b.createdAt || b.CreatedAt || 0);

                if (sortVal === 'name-asc') return nameA.localeCompare(nameB);
                if (sortVal === 'name-desc') return nameB.localeCompare(nameA);
                if (sortVal === 'id-asc') return idA.localeCompare(idB);
                if (sortVal === 'date-desc') return dateB - dateA;
                return 0;
            });

            kpiTotalClients.textContent = allClientsData.length;
            listContainer.innerHTML = '';

            if (filtered.length === 0) {
                listContainer.innerHTML = `<div class="p-8 text-center text-slate-400 font-medium">No clients found matching your query.</div>`;
                return;
            }

            filtered.forEach(client => {
                const id = client.clientId || client.ClientId || client.firebaseId || '---';
                const name = client.clientName || client.ClientName || client.name || 'Unnamed Client';
                const mobile = client.mobile || client.Mobile || client.phone || '';
                const pan = client.pan || client.Pan || '---';
                const adhar = client.adhar || client.Adhar || client.adharNumber || '---';
                const status = client.status || client.Status || 'Active';

                // Status Badge Color Handling
                let statusBadge = '';
                if (status === 'Regular') {
                    statusBadge = `<span class="bg-blue-50 text-blue-600 border border-blue-200 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">Regular</span>`;
                } else if (status === 'Non Active') {
                    statusBadge = `<span class="bg-slate-100 text-slate-500 border border-slate-200 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">Non Active</span>`;
                } else {
                    statusBadge = `<span class="bg-emerald-50 text-emerald-600 border border-emerald-200 px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider">Active</span>`;
                }

                // WhatsApp & Call links
                const waText = encodeURIComponent(`Hello ${name},\n\nGreetings from CM Filings! 🙏\n\n`);
                const waLink = mobile ? `https://wa.me/91${mobile}?text=${waText}` : '#';
                const callLink = mobile ? `tel:${mobile}` : '#';

                const cardDiv = document.createElement('div');
                cardDiv.className = "bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4";
                
                cardDiv.innerHTML = `
                    <div class="space-y-1.5 flex-1">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h4 class="font-extrabold text-brand-navy text-base">${name}</h4>
                            ${statusBadge}
                        </div>
                        <div class="flex items-center gap-4 text-xs font-mono text-slate-500">
                            <span class="text-brand-red font-bold">ID: ${id}</span>
                            <span>PAN: <strong class="text-slate-700 uppercase">${pan}</strong></span>
                            <span>Adhaar: <strong class="text-slate-700">${adhar}</strong></span>
                        </div>
                        <div class="flex items-center gap-2 pt-1 text-xs text-slate-600 font-semibold">
                            <i data-lucide="phone-call" class="w-3.5 h-3.5 text-slate-400"></i>
                            <span>${mobile || 'No Mobile Number'}</span>
                        </div>
                    </div>

                    <div class="flex items-center gap-2 shrink-0 border-t sm:border-t-0 pt-3 sm:pt-0 border-slate-100 justify-end">
                        ${mobile ? `
                            <a href="${callLink}" class="p-2.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 rounded-xl border border-emerald-200 transition-all" title="Call Client">
                                <i data-lucide="phone" class="w-4 h-4 pointer-events-none"></i>
                            </a>
                            <a href="${waLink}" target="_blank" class="p-2.5 bg-green-50 text-[#25D366] hover:bg-green-100 rounded-xl border border-green-200 transition-all" title="WhatsApp Message">
                                <i data-lucide="message-circle" class="w-4 h-4 pointer-events-none"></i>
                            </a>
                        ` : `
                            <button disabled class="p-2.5 bg-slate-100 text-slate-300 rounded-xl border border-slate-200 cursor-not-allowed" title="No Phone Available"><i data-lucide="phone-off" class="w-4 h-4"></i></button>
                        `}
                        <button class="btn-full-view p-2.5 bg-slate-50 text-slate-600 hover:text-brand-navy hover:bg-slate-100 rounded-xl border border-slate-200 transition-all flex items-center gap-1.5 text-xs font-bold px-3" data-id="${client.firebaseId}">
                            <i data-lucide="eye" class="w-4 h-4 pointer-events-none"></i> View & Manage
                        </button>
                    </div>
                `;
                listContainer.appendChild(cardDiv);
            });

            lucide.createIcons();
        }

        // ==========================================
        // SMART 10-DIGIT PHONE CONTACT PICKER API
        // ==========================================
        btnPickContact.addEventListener('click', async () => {
            if ('contacts' in navigator && 'Navigator' in window) {
                try {
                    const props = ['name', 'tel'];
                    const opts = { multiple: false };
                    const contacts = await navigator.contacts.select(props, opts);
                    
                    if (contacts && contacts.length > 0) {
                        const telArray = contacts[0].tel;
                        if (telArray && telArray.length > 0) {
                            let rawNum = telArray[0];
                            let cleanNum = rawNum.replace(/\D/g, '').slice(-10);
                            formMobile.value = cleanNum;
                            
                            if (!formClientName.value && contacts[0].name && contacts[0].name.length > 0) {
                                formClientName.value = contacts[0].name[0];
                            }
                        }
                    }
                } catch (ex) {
                    console.log("Contact selection canceled or not allowed", ex);
                }
            } else {
                alert("Contact Picker is not supported on this browser/device. Please type the 10-digit number manually.");
            }
        });

        // ==========================================
        // MODAL EVENT HANDLERS
        // ==========================================
        btnOpenAddModal.addEventListener('click', () => {
            modalTitle.textContent = "Add New Client";
            clientForm.reset();
            formFirebaseId.value = "";
            formClientId.value = "CLI_" + Math.random().toString(36).substring(2, 8).toUpperCase();
            clientModal.classList.remove('hidden');
        });

        btnCloseModal.addEventListener('click', () => clientModal.classList.add('hidden'));
        btnCloseView.addEventListener('click', () => viewModal.classList.add('hidden'));

        // Open Full View Modal
        listContainer.addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-full-view');
            if (btn) {
                const firebaseId = btn.getAttribute('data-id');
                const client = clientsMap[firebaseId];
                if (client) {
                    activeViewFirebaseId = firebaseId;
                    viewName.textContent = client.clientName || client.ClientName || client.name || 'Unnamed';
                    viewId.textContent = `ID: ${client.clientId || client.ClientId || firebaseId}`;
                    viewMobile.textContent = client.mobile || client.Mobile || 'No Mobile Provided';
                    viewEmail.textContent = client.email || client.Email || 'No Email';
                    viewPan.textContent = client.pan || client.Pan || 'No PAN';
                    viewAdhar.textContent = client.adhar || client.Adhar || 'No Adhaar';
                    viewGstin.textContent = client.gstin || client.Gstin || 'No GSTIN';
                    viewStatus.textContent = client.status || client.Status || 'Active';
                    viewAddress.textContent = client.address || client.Address || 'No Address Provided';

                    viewModal.classList.remove('hidden');
                }
            }
        });

        // Edit trigger from View Modal
        btnModalEdit.addEventListener('click', () => {
            viewModal.classList.add('hidden');
            const client = clientsMap[activeViewFirebaseId];
            if (client) {
                modalTitle.textContent = "Edit Client Profile";
                formFirebaseId.value = activeViewFirebaseId;
                formClientId.value = client.clientId || client.ClientId || activeViewFirebaseId;
                formClientName.value = client.clientName || client.ClientName || client.name || '';
                formMobile.value = client.mobile || client.Mobile || client.phone || '';
                formEmail.value = client.email || client.Email || '';
                formPan.value = client.pan || client.Pan || '';
                formAdhar.value = client.adhar || client.Adhar || '';
                formGstin.value = client.gstin || client.Gstin || '';
                formAddress.value = client.address || client.Address || '';
                formStatus.value = client.status || client.Status || 'Active';

                clientModal.classList.remove('hidden');
            }
        });

        // Delete trigger from View Modal
        btnModalDelete.addEventListener('click', async () => {
            if (confirm("Are you sure you want to delete this client record?")) {
                try {
                    await deleteDoc(doc(db, 'clients', activeViewFirebaseId));
                    viewModal.classList.add('hidden');
                } catch (err) {
                    console.error("Delete error:", err);
                    alert("Failed to delete client record.");
                }
            }
        });

        clientForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fId = formFirebaseId.value;
            const cId = formClientId.value.trim();
            const mobileVal = formMobile.value.trim();

            if (mobileVal.length !== 10) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }

            const originalText = btnSaveClient.innerHTML;
            btnSaveClient.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin inline"></i> Saving...`;
            lucide.createIcons();

            const clientPayload = {
                clientId: cId,
                clientName: formClientName.value.trim(),
                mobile: mobileVal,
                email: formEmail.value.trim(),
                pan: formPan.value.trim().toUpperCase(),
                adhar: formAdhar.value.trim(),
                gstin: formGstin.value.trim().toUpperCase(),
                address: formAddress.value.trim(),
                status: formStatus.value,
                updatedAt: new Date().toISOString()
            };

            try {
                const docId = fId || cId;
                if (!fId) {
                    clientPayload.createdAt = new Date().toISOString();
                }
                
                await setDoc(doc(db, 'clients', docId), clientPayload, { merge: true });

                clientModal.classList.add('hidden');
            } catch (error) {
                console.error("Error saving client:", error);
                alert("Failed to save client profile.");
            } finally {
                btnSaveClient.innerHTML = originalText;
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
