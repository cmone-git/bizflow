<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientHub CRM (Firebase Edition)</title>
  
  <script>
    window.onerror = function(msg, url, line, col, error) {
      var loader = document.getElementById('fallback-loader');
      if (loader) loader.innerHTML = '<div style="padding:20px;color:#dc2626;text-align:left;font-family:monospace;font-size:12px;background:#fef2f2;min-height:100vh;"><b>🚨 CRASH REPORT:</b><br><br>' + msg + '<br>Line: ' + line + '</div>';
    };
    window.addEventListener('unhandledrejection', function(event) {
      var loader = document.getElementById('fallback-loader');
      if (loader) loader.innerHTML = '<div style="padding:20px;color:#dc2626;text-align:left;font-family:monospace;font-size:12px;background:#fef2f2;min-height:100vh;"><b>📡 NETWORK / DATABASE ERROR:</b><br><br>' + (event.reason ? event.reason.toString() : 'Unknown Error') + '</div>';
    });
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script>window.react = window.React;</script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <!-- Firebase Loading Sequence -->
  <script type="module">
    window.firebaseLoadPromise = (async () => {
      try {
        const appMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
        const authMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
        const fsMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
        
        window.FirebaseAPI = {
          initializeApp: appMod.initializeApp, getAuth: authMod.getAuth,
          signInAnonymously: authMod.signInAnonymously, onAuthStateChanged: authMod.onAuthStateChanged,
          getFirestore: fsMod.getFirestore, collection: fsMod.collection, doc: fsMod.doc,
          addDoc: fsMod.addDoc, updateDoc: fsMod.updateDoc, deleteDoc: fsMod.deleteDoc, onSnapshot: fsMod.onSnapshot
        };
      } catch (err) {
        console.error("Critical error loading Firebase modules:", err);
        throw err;
      }
    })();
  </script>
</head>

    async function fetchWithBackoff(url, options, maxRetries = 5) {
      const delays = [1000, 2000, 4000, 8000, 16000];
      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(url, options);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          return await response.json();
        } catch (error) {
          if (i === maxRetries - 1) throw error;
          await new Promise(resolve => setTimeout(resolve, delays[i]));
        }
      }
    }

    // ==========================================
    // 2. Main Application UI Component
    // ==========================================
    function App({ data, updateItem, deleteItem, insertItem, isMockMode }) {
      
      const [activeTab, setActiveTab] = useState('analytics'); 
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [branchFilter, setBranchFilter] = useState('ALL');
      const [constitutionFilter, setConstitutionFilter] = useState('ALL');
      const [taxFilter, setTaxFilter] = useState('ALL');
      
      const [sortField, setSortField] = useState('clientId');
      const [sortDirection, setSortDirection] = useState('asc');
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 15;

      const [selectedClient, setSelectedClient] = useState(null);
      const [isDetailOpen, setIsDetailOpen] = useState(false);
      const [detailViewTab, setDetailViewTab] = useState('overview'); // overview, compliance, credentials
      
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingClient, setEditingClient] = useState(null);
      const [deleteCandidate, setDeleteCandidate] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [copiedField, setCopiedField] = useState('');

      const [isAILoading, setIsAILoading] = useState(false);
      const [aiResponse, setAiResponse] = useState('');
      const [aiInputText, setAiInputText] = useState('');
      const [showAIInput, setShowAIInput] = useState(false);
      const fileInputRef = useRef(null);

      // FULL CLIENT SCHEMA
      const [formData, setFormData] = useState({
        clientId: '', clientName: '', mobile: '', email: '', legalName: '',
        constitution: '', status: 'Active', pan: '', gstin: '', adhar: '',
        address: '', branchId: '', notes: '', folderUrl: ''
      });

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const clients = useMemo(() => {
        if (!Array.isArray(data)) return [];
        return data.map((d) => ({
          id: d.id, clientId: String(d.clientId || ''), clientName: String(d.clientName || 'Unnamed Client'),
          mobile: String(d.mobile || ''), email: String(d.email || ''), legalName: String(d.legalName || ''),
          constitution: String(d.constitution || ''), status: String(d.status || 'Unspecified'),
          pan: String(d.pan || ''), gstin: String(d.gstin || ''), adhar: String(d.adhar || ''),
          address: String(d.address || ''), branchId: String(d.branchId || ''), notes: String(d.notes || ''),
          folderUrl: String(d.folderUrl || ''), createdAt: String(d.createdAt || ''), updatedAt: String(d.updatedAt || '')
        }));
      }, [data]);

      const getNextClientId = () => {
        let maxNum = 40000;
        clients.forEach(c => {
          const num = parseInt(c.clientId.replace(/\D/g, ''), 10);
          if (!isNaN(num) && num > maxNum) maxNum = num;
        });
        return `C${maxNum + 1}`;
      };

      const branchOptions = useMemo(() => {
        const set = new Set();
        clients.forEach(c => { if (c.branchId) set.add(c.branchId); });
        return Array.from(set).sort();
      }, [clients]);

      const constitutionOptions = useMemo(() => {
        const set = new Set();
        clients.forEach(c => { if (c.constitution) set.add(c.constitution); });
        return Array.from(set).sort();
      }, [clients]);

      const filteredClients = useMemo(() => {
        return clients.filter(c => {
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            if (!c.clientName.toLowerCase().includes(q) && !c.clientId.toLowerCase().includes(q) && 
                !c.email.toLowerCase().includes(q) && !c.pan.toLowerCase().includes(q) && 
                !c.mobile.toLowerCase().includes(q) && !c.branchId.toLowerCase().includes(q) &&
                !c.legalName.toLowerCase().includes(q)) return false;
          }
          if (statusFilter !== 'ALL') {
            if (statusFilter === 'Active' && c.status !== 'Active') return false;
            if (statusFilter === 'Unspecified' && c.status === 'Active') return false;
          }
          if (branchFilter !== 'ALL') {
            if (branchFilter === 'UNASSIGNED' && c.branchId !== '') return false;
            if (branchFilter !== 'UNASSIGNED' && c.branchId !== branchFilter) return false;
          }
          if (constitutionFilter !== 'ALL') {
            if (constitutionFilter === 'UNSPECIFIED' && c.constitution !== '') return false;
            if (constitutionFilter !== 'UNSPECIFIED' && c.constitution !== constitutionFilter) return false;
          }
          if (taxFilter !== 'ALL') {
            if (taxFilter === 'HAS_PAN' && (!c.pan || c.pan === 'PANNOTREQD')) return false;
            if (taxFilter === 'HAS_GST' && (!c.gstin || c.gstin === 'N/A')) return false;
            if (taxFilter === 'NO_TAX' && (c.pan && c.pan !== 'PANNOTREQD' || (c.gstin && c.gstin !== 'N/A'))) return false;
          }
          return true;
        });
      }, [clients, searchQuery, statusFilter, branchFilter, constitutionFilter, taxFilter]);

      const sortedClients = useMemo(() => {
        return [...filteredClients].sort((a, b) => {
          let valA = a[sortField] || ''; let valB = b[sortField] || '';
          if (typeof valA === 'string') valA = valA.toLowerCase();
          if (typeof valB === 'string') valB = valB.toLowerCase();
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filteredClients, sortField, sortDirection]);

      useEffect(() => { setCurrentPage(1); }, [searchQuery, statusFilter, branchFilter, constitutionFilter, taxFilter]);

      const totalPages = Math.max(1, Math.ceil(sortedClients.length / pageSize));
      const paginatedClients = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return sortedClients.slice(start, start + pageSize);
      }, [sortedClients, currentPage, pageSize]);

      const kpis = useMemo(() => {
        const total = clients.length;
        const active = clients.filter(c => c.status === 'Active').length;
        const withPan = clients.filter(c => c.pan && c.pan !== 'PANNOTREQD').length;
        const withGst = clients.filter(c => c.gstin && c.gstin !== 'N/A' && c.gstin !== 'null').length;
        const withContact = clients.filter(c => c.email || c.mobile).length;
        return {
          total, active, activePct: total > 0 ? Math.round((active / total) * 100) : 0,
          withPan, panPct: total > 0 ? Math.round((withPan / total) * 100) : 0,
          withGst, withContact, contactPct: total > 0 ? Math.round((withContact / total) * 100) : 0
        };
      }, [clients]);

      const handleSort = (field) => {
        if (sortField === field) setSortDirection(prev => prev === 'asc' ? 'desc' : 'asc');
        else { setSortField(field); setSortDirection('asc'); }
      };

      const openAddModal = () => {
        setEditingClient(null);
        setFormData({
          clientId: getNextClientId(), clientName: '', mobile: '', email: '', legalName: '',
          constitution: 'Individual', status: 'Active', pan: '', gstin: '', adhar: '',
          address: '', branchId: branchOptions[0] || 'CMF', notes: '', folderUrl: ''
        });
        setIsFormOpen(true);
      };

      const openEditModal = (client, e) => {
        if (e) e.stopPropagation();
        setEditingClient(client);
        setFormData({ ...client });
        setIsFormOpen(true);
      };

      const openClientDetail = (client) => {
        setSelectedClient(client);
        setDetailViewTab('overview');
        setAiResponse('');
        setIsDetailOpen(true);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!formData.clientName.trim()) return;
        if (editingClient) {
          updateItem({ ...formData, id: editingClient.id });
          showToast(`Updated client ${formData.clientId}`);
        } else {
          insertItem(formData);
          showToast(`Added new client ${formData.clientId}`);
        }
        setIsFormOpen(false);
      };

      const confirmDelete = () => {
        if (deleteCandidate) {
          deleteItem(deleteCandidate.id);
          showToast(`Deleted client ${deleteCandidate.clientId}`);
          setDeleteCandidate(null);
          if (selectedClient && selectedClient.id === deleteCandidate.id) setIsDetailOpen(false);
        }
      };

      const copyToClipboard = (text, fieldName) => {
        if (!text) return;
        document.execCommand('copy'); 
        navigator.clipboard?.writeText(text);
        setCopiedField(fieldName);
        setTimeout(() => setCopiedField(''), 2000);
      };

      const getPhoneLink = (phone, type) => {
        if (!phone) return '#';
        let num = phone.replace(/\D/g, ''); 
        if (num.length === 10) num = '91' + num; 
        switch (type) {
          case 'call': return `tel:+${num}`;
          case 'wa': return `https://wa.me/${num}`;
          case 'sms': return `sms:+${num}`;
          default: return '#';
        }
      };

      const handleImportContact = async () => {
        if ('contacts' in navigator && 'ContactsManager' in window) {
          try {
            const properties = ['name', 'tel', 'email'];
            const contacts = await navigator.contacts.select(properties, { multiple: false });
            if (contacts && contacts.length > 0) {
              const contact = contacts[0];
              let phone = contact.tel?.[0] || '';
              phone = phone.replace(/\D/g, '');
              if (phone.length > 10) phone = phone.slice(-10);
              setFormData(prev => ({ ...prev, clientName: contact.name?.[0] || prev.clientName, mobile: phone, email: contact.email?.[0] || prev.email }));
              showToast('Contact imported successfully!');
            }
          } catch (ex) { showToast('Contact selection cancelled.'); }
        } else { showToast('Contact Picker not supported here.'); }
      };

      const downloadCsvTemplate = () => {
        const headers = "ClientId,ClientName,Mobile,Email,LegalName,Constitution,Status,Pan,Gstin,Adhar,Address,BranchId,Notes,ClientFolderUrl\n";
        const sample = "C40001,Acme Corp,9876543210,contact@acme.com,Acme Corporation Ltd,Private Limited,Active,ABCDE1234F,29ABCDE1234F1Z5,,123 Main St,HQ,Key client,https://drive.google.com/...\n";
        const blob = new Blob([headers + sample], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', 'ClientHub_Template.csv');
        a.click();
      };

      const handleCsvImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = async (event) => {
          const text = event.target.result;
          const lines = text.split(/\r?\n/);
          if (lines.length < 2) {
            showToast("CSV must contain headers and at least one row.");
            return;
          }
          
          const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
          let importedCount = 0;

          for (let i = 1; i < lines.length; i++) {
            const rowText = lines[i];
            if (!rowText.trim()) continue;
            
            // Simple comma split (ensure your CSV doesn't have commas inside values for this basic parser)
            const row = rowText.split(','); 
            const newClient = {};
            
            headers.forEach((h, idx) => {
               // Map CSV headers to internal state names
               let key = h;
               if(h === 'clientfolderurl') key = 'folderUrl';
               if(h === 'adhar') key = 'adhar';
               // Auto-camelCase conversion for other fields
               if(h !== 'folderUrl' && h !== 'adhar') {
                  const parts = h.split(/(?=[A-Z])/);
                  if(parts.length === 1 && h === 'clientid') key = 'clientId';
                  if(h === 'clientname') key = 'clientName';
                  if(h === 'legalname') key = 'legalName';
                  if(h === 'branchid') key = 'branchId';
               }
               newClient[key] = row[idx] ? row[idx].trim() : '';
            });

            if (newClient.clientName || newClient.clientId) {
               insertItem(newClient);

                    <div><label className="block text-slate-700 font-bold mb-1.5">PAN Number</label><input type="text" value={formData.pan} onChange={(e) => setFormData({ ...formData, pan: e.target.value.toUpperCase() })} className="w-full p-2.5 border border-slate-300 rounded-lg font-mono uppercase focus:ring-2 focus:ring-indigo-500 shadow-sm" /></div>
                    <div><label className="block text-slate-700 font-bold mb-1.5">GSTIN Number</label><input type="text" value={formData.gstin} onChange={(e) => setFormData({ ...formData, gstin: e.target.value.toUpperCase() })} className="w-full p-2.5 border border-slate-300 rounded-lg font-mono uppercase focus:ring-2 focus:ring-indigo-500 shadow-sm" /></div>
                    <div><label className="block text-slate-700 font-bold mb-1.5">Aadhaar Reference</label><input type="text" value={formData.adhar} onChange={(e) => setFormData({ ...formData, adhar: e.target.value.replace(/\D/g, '').slice(0,12) })} placeholder="12 Digit Number" className="w-full p-2.5 border border-slate-300 rounded-lg font-mono focus:ring-2 focus:ring-indigo-500 shadow-sm" /></div>
                    <div>
                      <label className="block text-slate-700 font-bold mb-1.5">Constitution</label>
                      <select value={formData.constitution} onChange={(e) => setFormData({ ...formData, constitution: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm">
                        <option value="">(Select Entity Type)</option>
                        <option value="Individual">Individual</option>
                        <option value="Proprietorship">Proprietorship</option>
                        <option value="Partnership">Partnership</option>
                        <option value="Private Limited">Private Limited</option>
                        <option value="LLP">LLP</option>
                        <option value="HUF">HUF</option>
                        <option value="Trust">Trust</option>
                      </select>
                    </div>

                    <div className="sm:col-span-2"><label className="block text-slate-700 font-bold mb-1.5">Registered Address</label><textarea value={formData.address} onChange={(e) => setFormData({ ...formData, address: e.target.value })} rows={2} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 shadow-sm" /></div>

                    {/* Meta Data */}
                    <div className="sm:col-span-2 mt-2">
                      <h4 className="font-bold text-slate-900 border-b border-slate-100 pb-1 mb-3 text-[10px] uppercase tracking-wider text-slate-400">System & Vault</h4>
                    </div>
                    <div>
                      <label className="block text-slate-700 font-bold mb-1.5">Assigned Branch</label>
                      <input type="text" value={formData.branchId} onChange={(e) => setFormData({ ...formData, branchId: e.target.value.toUpperCase() })} placeholder="e.g. HQ, CMF" className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 uppercase shadow-sm" />
                    </div>
                    <div>
                      <label className="block text-slate-700 font-bold mb-1.5">Status</label>
                      <select value={formData.status} onChange={(e) => setFormData({ ...formData, status: e.target.value })} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 bg-white shadow-sm">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                        <option value="Pending">Pending</option>
                        <option value="Unspecified">Unspecified</option>
                      </select>
                    </div>
                    <div className="sm:col-span-2"><label className="block text-slate-700 font-bold mb-1.5">Client Cloud Folder URL</label><input type="url" value={formData.folderUrl} onChange={(e) => setFormData({ ...formData, folderUrl: e.target.value })} placeholder="https://drive.google.com/..." className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 text-blue-600 shadow-sm" /></div>
                    <div className="sm:col-span-2"><label className="block text-slate-700 font-bold mb-1.5">Secure Notes / Vault Data</label><textarea value={formData.notes} onChange={(e) => setFormData({ ...formData, notes: e.target.value })} rows={3} placeholder="Portal logins, special instructions..." className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 shadow-sm font-mono text-[11px]" /></div>
                  </div>
                </form>
                
                <div className="p-4 sm:p-5 border-t border-slate-200 bg-slate-50 flex items-center justify-end space-x-3 shrink-0">
                  <button type="button" onClick={() => setIsFormOpen(false)} className="px-5 py-2.5 bg-white border border-slate-300 rounded-xl text-slate-700 font-bold hover:bg-slate-50 shadow-sm">Cancel</button>
                  <button onClick={handleFormSubmit} className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold shadow-md transition-colors flex items-center gap-2">
                    <Icon name="checkCircle" className="w-4 h-4" />
                    {editingClient ? 'Save Changes' : 'Create Client'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {deleteCandidate && (
            <div className="fixed inset-0 z-[70] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl border border-slate-200 animate-in zoom-in-95 duration-200">
                <div className="w-14 h-14 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-5 shadow-inner"><Icon name="trash" className="w-7 h-7" /></div>
                <h3 className="text-lg font-extrabold text-slate-900 text-center">Delete Client Record?</h3>
                <p className="text-center text-slate-500 text-sm mt-2">This action cannot be undone. Are you sure?</p>
                <div className="mt-8 flex items-center space-x-3">
                  <button onClick={() => setDeleteCandidate(null)} className="flex-1 py-3 bg-white border border-slate-200 hover:bg-slate-50 rounded-xl text-sm font-bold text-slate-700 shadow-sm">Cancel</button>
                  <button onClick={confirmDelete} className="flex-1 py-3 bg-rose-600 text-white hover:bg-rose-700 rounded-xl text-sm font-bold shadow-md">Delete</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. Database & Firebase Initializer
    // ==========================================
    function FirebaseAppWrapper() {
      const [data, setData] = useState([]);
      const [loading, setLoading] = useState(true);
      const [user, setUser] = useState(null);
      const [fb, setFb] = useState(null); 
      const [isMockMode, setIsMockMode] = useState(false);
      const [showDemoButton, setShowDemoButton] = useState(false);

      useEffect(() => {
        const rawLoader = document.getElementById('fallback-loader');
        if (rawLoader) rawLoader.style.display = 'none';
      }, []);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (loading) setShowDemoButton(true);
        }, 5000);
        return () => clearTimeout(timer);
      }, [loading]);

      const activateDemoMode = () => {
        setIsMockMode(true);
        setData([
          { id: '1', clientId: 'C40001', clientName: 'Demo Client', legalName: 'Demo Corporation Private Limited', mobile: '9876543210', email: 'admin@demo.test', constitution: 'Private Limited', status: 'Active', pan: 'ABCDE1234F', gstin: '29ABCDE1234F1Z5', adhar: '', address: '123 Tech Park, Bangalore', branchId: 'HQ', notes: 'Demo login: user/pass', folderUrl: 'https://drive.google.com/' }
        ]);
        setLoading(false);
      };

      useEffect(() => {
        let unsubscribeAuth = null;
        let unsubscribeSnap = null;

        const initFirebase = async () => {
          try {
            await window.firebaseLoadPromise;
            const FB = window.FirebaseAPI;
            const config = MY_FIREBASE_CONFIG;
            const appId = config.appId;
            const app = FB.initializeApp(config);
            const auth = FB.getAuth(app);
            const db = FB.getFirestore(app);
            
            setFb({
               db, appId,
               addDoc: FB.addDoc, updateDoc: FB.updateDoc,
               deleteDoc: FB.deleteDoc, collection: FB.collection, doc: FB.doc
            });

            await FB.signInAnonymously(auth);

            unsubscribeAuth = FB.onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              if (currentUser) {
                 const collRef = FB.collection(db, 'artifacts', appId, 'users', currentUser.uid, 'clients');
                 unsubscribeSnap = FB.onSnapshot(collRef, (snapshot) => {
                    const clientsList = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                    setData(clientsList);
                    setLoading(false);
                 }, (err) => {
                    console.warn("Firestore error:", err);
                    activateDemoMode();
                 });
              }
            });
          } catch (e) {
             console.warn("Firebase Init error:", e);
             activateDemoMode();
          }
        };
        
        initFirebase();

        return () => {
           if (unsubscribeAuth) unsubscribeAuth();
           if (unsubscribeSnap) unsubscribeSnap();
        };
      }, []);

      const insertItem = async (clientData) => {
         if (isMockMode || !fb || !user) { setData(prev => [...prev, { ...clientData, id: Date.now().toString() }]); return; }
         try {
             const collRef = fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'clients');
             await fb.addDoc(collRef, { ...clientData, createdAt: new Date().toISOString() });
         } catch(e) { console.error("Error adding doc: ", e); }
      };
      
      const updateItem = async (clientData) => {
         if (isMockMode || !fb || !user) { setData(prev => prev.map(c => c.id === clientData.id ? clientData : c)); return; }
         try {
             const { id, ...dataToUpdate } = clientData;
             const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'clients', id);
             dataToUpdate.updatedAt = new Date().toISOString();
             await fb.updateDoc(docRef, dataToUpdate);
         } catch(e) { console.error("Error updating doc: ", e); }
      };
      
      const deleteItem = async (id) => {
         if (isMockMode || !fb || !user) { setData(prev => prev.filter(c => c.id !== id)); return; }
         try {
             const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, 'clients', id);
             await fb.deleteDoc(docRef);
         } catch(e) { console.error("Error deleting doc: ", e); }
      };
      
      if (loading) {
        return (
           <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 gap-4 p-4 text-center">
              <div className="animate-spin w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full mb-2"></div>
              <p className="text-slate-600 font-bold text-lg">Connecting to Secure CRM Database...</p>
              {showDemoButton && (
                <div className="mt-4 animate-in fade-in duration-300 flex flex-col items-center">
                  <p className="text-xs text-amber-600 mb-3 font-semibold">Taking longer than usual? (Check Anonymous Auth in Firebase)</p>
                  <button onClick={activateDemoMode} className="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-md hover:bg-indigo-700 transition-colors cursor-pointer">
                    Launch CRM in Offline Mode 🚀
                  </button>
                </div>
              )}
           </div>
        );
      }

      return <App data={data} insertItem={insertItem} updateItem={updateItem} deleteItem={deleteItem} isMockMode={isMockMode} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FirebaseAppWrapper />);
  </script>
</body>
</html>
