<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CM ADMIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
</head>
<body class="bg-slate-50 text-slate-800">

  <div id="root">
      <div class="min-h-screen flex items-center justify-center">
          <div class="animate-spin w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full"></div>
      </div>
  </div>

  <script type="module" type="text/babel">
    import { auth, db, FB } from './js/firebase.js';
    import { requireAuth } from './js/guard.js';
    const { useState, useEffect } = React;

    function Dashboard({ user }) {
        const [clients, setClients] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            // Subscribe to Firestore Data mapped to this Branch/Admin
            const baseRef = FB.collection(db, 'artifacts', FB.appId, 'orgData', 'main', 'clients');
            const unsubscribe = FB.onSnapshot(baseRef, (snap) => {
                const data = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Requirement 5: Branch filtering
                if(user.role === 'admin') setClients(data);
                else setClients(data.filter(c => c.branchId === user.assignedBranch));
                setLoading(false);
            });
            return () => unsubscribe();
        }, []);

        const handleLogout = () => FB.signOut(auth);

        if(loading) return <div className="p-8 text-center text-slate-500">Loading Dashboard Data...</div>;

        return (
            <div className="pb-24">
                {/* Header */}
                <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm px-4 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">CM</div>
                        <div>
                            <h1 className="font-bold text-slate-900 leading-tight">Dashboard</h1>
                            <p className="text-[10px] text-slate-500 uppercase">{user.role === 'admin' ? 'Corporate Admin' : `Branch: ${user.assignedBranch}`}</p>
                        </div>
                    </div>
                    <button onClick={handleLogout} className="text-rose-600 text-sm font-bold">Logout</button>
                </header>

                {/* Main Content */}
                <main className="max-w-7xl mx-auto p-4 space-y-6 pt-6">
                    <div className="bg-gradient-to-br from-indigo-900 via-violet-800 to-indigo-900 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                      <div className="relative z-10">
                        <span className="inline-block bg-indigo-500/30 text-indigo-200 border border-indigo-400/30 text-xs px-2.5 py-1 rounded-full mb-3">✨ Real-time Summary</span>
                        <h2 className="text-2xl font-extrabold tracking-tight">Client Portfolio</h2>
                        <p className="text-indigo-200 text-xs mt-1">Managing {clients.length} client records.</p>
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-4">
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 text-center">
                            <div className="text-3xl font-extrabold text-slate-900">{clients.length}</div>
                            <div className="text-xs text-slate-500 font-bold uppercase mt-1">Total Clients</div>
                        </div>
                        <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 text-center">
                            <div className="text-3xl font-extrabold text-slate-900">{clients.filter(c=>!c.mobile).length}</div>
                            <div className="text-xs text-rose-500 font-bold uppercase mt-1">Missing Mobile</div>
                        </div>
                    </div>
                </main>

                {/* Standardized Bottom Navigation */}
                <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40 flex justify-between px-2 pb-2 pt-2">
                    <a href="admin.html" className="flex-1 text-center text-indigo-600 font-bold text-xs p-2">Dash</a>
                    <a href="clients.html" className="flex-1 text-center text-slate-400 hover:text-slate-600 font-bold text-xs p-2">Clients</a>
                    <a href="compliances.html" className="flex-1 text-center text-slate-400 hover:text-slate-600 font-bold text-xs p-2">Tasks</a>
                    <a href="payments.html" className="flex-1 text-center text-slate-400 hover:text-slate-600 font-bold text-xs p-2">Billing</a>
                </div>
            </div>
        );
    }

    // Protect the Route before rendering React
    requireAuth((user) => {
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard user={user} />);
    });
  </script>
</body>
</html>
