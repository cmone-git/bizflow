<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CM ADMIN - ClientHub CRM</title>
  
  <!-- PWA & BRANDING ASSETS -->
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#312e81">
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed: ', err));
      });
    }
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script>window.react = window.React;</script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <!-- Firebase Loading Sequence -->
  <script type="module">
    window.firebaseLoadPromise = (async () => {
      try {
        const appMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
        const authMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
        const fsMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
        
        window.FirebaseAPI = {
          initializeApp: appMod.initializeApp, 
          getAuth: authMod.getAuth, 
          signInWithEmailAndPassword: authMod.signInWithEmailAndPassword,
          createUserWithEmailAndPassword: authMod.createUserWithEmailAndPassword,
          signInWithPopup: authMod.signInWithPopup,
          GoogleAuthProvider: authMod.GoogleAuthProvider,
          signOut: authMod.signOut,
          onAuthStateChanged: authMod.onAuthStateChanged,
          getFirestore: fsMod.getFirestore, collection: fsMod.collection, doc: fsMod.doc, 
          addDoc: fsMod.addDoc, updateDoc: fsMod.updateDoc, deleteDoc: fsMod.deleteDoc, 
          onSnapshot: fsMod.onSnapshot, setDoc: fsMod.setDoc
        };
      } catch (err) {
        console.error("Firebase load error:", err);
      }
    })();
  </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-indigo-200">
  
  <!-- React Root Container (Fallback UI is INSIDE root so React automatically clears it cleanly) -->
  <div id="root">
     <div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-indigo-900 via-violet-800 to-indigo-900 p-4 text-center">
        <div class="animate-spin w-12 h-12 border-4 border-indigo-300 border-t-white rounded-full mb-6"></div>
        <h2 class="text-xl font-extrabold text-white tracking-tight">ClientHub CRM</h2>
        <p class="text-sm text-indigo-200 mt-2 font-medium">Initializing secure environment...</p>
     </div>
  </div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ==========================================
    // CORPORATE SVG ICONS
    // ==========================================
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const paths = {
        users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
        barChart: <><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></>,
        list: <><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>,
        phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>,
        grid: <><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>,
        plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
        search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
        x: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
        edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
        trash: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>,
        shieldCheck: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></>,
        database: <><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></>,
        upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>,
        download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
        fileText: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></>,
        key: <><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></>,
        menu: <><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></>,
        clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
        checkCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
        building: <><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></>,
        qrCode: <><rect x="3" y="3" width="5" height="5" rx="1" ry="1"/><rect x="16" y="3" width="5" height="5" rx="1" ry="1"/><rect x="3" y="16" width="5" height="5" rx="1" ry="1"/><path d="M21 16h-3v3h3z"/><path d="M12 3v5"/><path d="M12 16v5"/><path d="M3 12h18"/></>,
        indianRupee: <><path d="M6 3h12"/><path d="M6 8h12"/><path d="M6 13l8.5 8"/><path d="M6 13h3c3.314 0 6-2.686 6-6s-2.686-6-6-6"/></>,
        chevronLeft: <polyline points="15 18 9 12 15 6"/>,
        chevronRight: <polyline points="9 18 15 12 9 6"/>,
        copy: <><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></>,
        check: <polyline points="20 6 9 17 4 12"/>,
        sparkles: <><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/><path d="M20.5 5.5 19 9l-1.5-3.5L14 4l3.5-1.5L19 2l1.5 3.5L24 7l-3.5 1.5Z"/></>,
        messageCircle: <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>,
        eye: <><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,
        eyeOff: <><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></>,
        logOut: <><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></>
      };
      return <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{paths[name] || paths.list}</svg>;
    };

    const Spinner = ({ className = "w-5 h-5 animate-spin" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    );

    // ==========================================
    // DONUT CHART COMPONENT
    // ==========================================
    const DonutChart = ({ data }) => {
      const total = data.reduce((acc, item) => acc + (Number(item.value)||0), 0);
      let cumulativePercent = 0;

      if (total === 0) {
        return (
          <div className="flex flex-col items-center justify-center h-40">
            <Icon name="clock" className="w-10 h-10 text-slate-200 mb-2" />
            <span className="text-xs text-slate-400 font-medium">No Tasks Logged</span>
          </div>
        );
      }

      return (
        <div className="flex items-center gap-6">
          <svg viewBox="0 0 36 36" className="w-32 h-32 transform -rotate-90">
            {data.map((slice, i) => {
              const percent = ((Number(slice.value)||0) / total) * 100;
              const strokeDasharray = `${percent} ${100 - percent}`;
              const strokeDashoffset = -cumulativePercent;
              cumulativePercent += percent;
              return <circle key={i} r="15.91549430918954" cx="18" cy="18" fill="transparent" stroke={slice.color} strokeWidth="4" strokeDasharray={strokeDasharray} strokeDashoffset={strokeDashoffset} className="transition-all duration-1000 ease-out" />;
            })}
          </svg>
          <div className="flex flex-col gap-2 flex-1">
            {data.map((slice, i) => (
              <div key={i} className="flex items-center justify-between text-xs">
                <div className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: slice.color }}></span><span className="text-slate-600 font-semibold">{slice.label}</span></div>
                <span className="font-bold text-slate-900">{slice.value}</span>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ==========================================
    // MAIN APPLICATION DASHBOARD (Loaded after Auth)
    // ==========================================
    function App({ clientsData, compliancesData, credentialsData, companyProfile, paymentLinks, insertRecord, updateRecord, deleteRecord, setCompanyProfile, currentUser, handleLogout }) {
      
      const isAdmin = currentUser?.role === 'admin';
      
      // Branch Filtering (Requirement 5)
      const visibleClients = useMemo(() => isAdmin ? clientsData : clientsData.filter(c => c.branchId === currentUser?.assignedBranch), [clientsData, isAdmin, currentUser]);
      const visibleCompliances = useMemo(() => isAdmin ? compliancesData : compliancesData.filter(c => visibleClients.some(vc => vc.clientId === c.ClientID)), [compliancesData, visibleClients, isAdmin]);
      const visibleCredentials = useMemo(() => isAdmin ? credentialsData : credentialsData.filter(c => visibleClients.some(vc => vc.clientId === c.ClientID)), [credentialsData, visibleClients, isAdmin]);

      const [activeTab, setActiveTab] = useState('analytics'); 
      const [menuView, setMenuView] = useState('main'); 
      
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [sortField, setSortField] = useState('createdAt');
      const [sortDirection, setSortDirection] = useState('desc');
      const [currentPage, setCurrentPage] = useState(1);
      const pageSize = 15;

      const [selectedClient, setSelectedClient] = useState(null);
      const [isDetailOpen, setIsDetailOpen] = useState(false);
      const [detailViewTab, setDetailViewTab] = useState('overview'); 
      
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [isComplianceFormOpen, setIsComplianceFormOpen] = useState(false);
      const [isCredentialFormOpen, setIsCredentialFormOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [deleteCandidate, setDeleteCandidate] = useState(null);

      const [toastMessage, setToastMessage] = useState(null);
      const [copiedField, setCopiedField] = useState('');

      // Form States
      const [clientForm, setClientForm] = useState({ clientId: '', clientName: '', mobile: '', email: '', legalName: '', constitution: '', status: 'Active', pan: '', gstin: '', adhar: '', address: '', branchId: '', notes: '', folderUrl: '' });
      const [compForm, setCompForm] = useState({ ComplianceID: '', Date: '', CompllianceName: '', ComplianceFrequency: '', PeriodOfCompliance: '', ClientID: '', ClientName: '', Priority: '', DueDate: '', StatusofCompliance: '', ProfessionalFee: '', ProformaInvoiceNo: '', PaymentStatus: '', ComplianceFolderUrl: '', AknNo: '', AknUrl: '', Comments: '' });
      const [credForm, setCredForm] = useState({ CredentialID: '', ClientID: '', ClientName: '', PortalName: '', URL: '', Username: '', Password: '', Notes: '' });
      const [companyForm, setCompanyForm] = useState({ companyName: '', email: '', phone: '', address: '', bankName: '', accNo: '', ifsc: '', upiId: '' });
      const [qrForm, setQrForm] = useState({ clientId: '', mobile: '', amount: '' });
      const [generatedQR, setGeneratedQR] = useState(null);

      useEffect(() => { if(companyProfile) setCompanyForm(companyProfile); }, [companyProfile]);

      const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3000); };

      const getNextId = (dataArray, prefix) => {
        if (!dataArray || !Array.isArray(dataArray)) return `${prefix}10001`;
        let maxNum = 40000;
        dataArray.forEach(c => {
          const num = parseInt(String(c[`${prefix.toLowerCase()}Id`] || c[`${prefix}ID`] || '0').replace(/\D/g, ''), 10);
          if (!isNaN(num) && num > maxNum) maxNum = num;
        });
        return `${prefix}${maxNum + 1}`;
      };

      // KPIs
      const kpis = useMemo(() => {
        const total = visibleClients.length;
        const active = visibleClients.filter(c => c.status === 'Active').length;
        const noMobile = visibleClients.filter(c => !c.mobile || c.mobile.trim() === '').length;
        return { total, active, activePct: total > 0 ? Math.round((active / total) * 100) : 0, noMobile };
      }, [visibleClients]);

      const compChartData = useMemo(() => {
        let pending = 0, completed = 0, overdue = 0;
        const today = new Date().toISOString().split('T')[0];
        visibleCompliances.forEach(c => {
          if (c.StatusofCompliance === 'Completed') completed++;
          else if (c.DueDate && c.DueDate < today) overdue++;
          else pending++;
        });
        return [
          { label: 'Completed', value: completed, color: '#10b981' }, 
          { label: 'Pending Task', value: pending, color: '#6366f1' },    
          { label: 'Overdue', value: overdue, color: '#ef4444' }     
        ];
      }, [visibleCompliances]);

      // Global Filtering (Requirement 3 & 7)
      const filteredClients = useMemo(() => {
        return visibleClients.filter(c => {
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            const matchClient = [c.clientName, c.clientId, c.mobile, c.email, c.pan, c.adhar].some(val => String(val||'').toLowerCase().includes(q));
            if (!matchClient) return false;
          }
          if (statusFilter !== 'ALL' && c.status !== statusFilter) return false;
          return true;
        });
      }, [visibleClients, searchQuery, statusFilter]);

      const filteredCompliances = useMemo(() => {
        return visibleCompliances.filter(c => {
          if (searchQuery) {
             const q = searchQuery.toLowerCase();
             const linkedClient = visibleClients.find(vc => vc.clientId === c.ClientID) || {};
             const match = [c.CompllianceName, c.ComplianceID, c.ClientName, c.ClientID, linkedClient.pan, linkedClient.adhar, linkedClient.mobile].some(val => String(val||'').toLowerCase().includes(q));
             if(!match) return false;
          }
          return true;
        });
      }, [visibleCompliances, visibleClients, searchQuery]);

      const filteredCredentials = useMemo(() => {
        return visibleCredentials.filter(c => {
          if (searchQuery) {
             const q = searchQuery.toLowerCase();
             const linkedClient = visibleClients.find(vc => vc.clientId === c.ClientID) || {};
             const match = [c.PortalName, c.ClientName, c.ClientID, linkedClient.pan, linkedClient.adhar, linkedClient.mobile].some(val => String(val||'').toLowerCase().includes(q));
             if(!match) return false;
          }
          return true;
        });
      }, [visibleCredentials, visibleClients, searchQuery]);

      // Sorting
      const sortedClients = useMemo(() => {
        return [...filteredClients].sort((a, b) => {
          let valA = a[sortField] || ''; let valB = b[sortField] || '';
          if (typeof valA === 'string') valA = valA.toLowerCase();
          if (typeof valB === 'string') valB = valB.toLowerCase();
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filteredClients, sortField, sortDirection]);

      const paginatedClients = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return sortedClients.slice(start, start + pageSize);
      }, [sortedClients, currentPage, pageSize]);

      useEffect(() => { setCurrentPage(1); }, [searchQuery, statusFilter]);

      // Saves
      const handleSaveClient = (e) => {
        e.preventDefault();
        if (editingItem) { updateRecord('clients', { ...clientForm, id: editingItem.id }); showToast("Client Updated"); } 
        else { insertRecord('clients', clientForm); showToast("Client Created"); }
        setIsFormOpen(false);
      };

      const handleSaveCompliance = (e) => {
        e.preventDefault();
        const linkedClient = visibleClients.find(c => c.clientId === compForm.ClientID);
        const finalForm = { ...compForm, ClientName: linkedClient ? linkedClient.clientName : compForm.ClientName };
        if (editingItem) { updateRecord('compliances', { ...finalForm, id: editingItem.id }); showToast("Task Updated"); } 
        else { insertRecord('compliances', finalForm); showToast("Task Logged"); }
        setIsComplianceFormOpen(false);
      };

      const handleSaveCredential = (e) => {
        e.preventDefault();
        const linkedClient = visibleClients.find(c => c.clientId === credForm.ClientID);
        const finalForm = { ...credForm, ClientName: linkedClient ? linkedClient.clientName : credForm.ClientName };
        if (editingItem) { updateRecord('credentials', { ...finalForm, id: editingItem.id }); showToast("Vault Updated"); } 
        else { insertRecord('credentials', finalForm); showToast("Credentials Saved"); }
        setIsCredentialFormOpen(false);
      };

      const handleSaveCompany = (e) => {
         e.preventDefault(); setCompanyProfile(companyForm); showToast("Firm Profile Saved!"); setMenuView('main');
      };

      // QR Generator
      const handleQRClientSelect = (e) => {
         const cid = e.target.value;
         const client = visibleClients.find(c => c.clientId === cid);
         setQrForm({ ...qrForm, clientId: cid, mobile: client ? client.mobile : '' });
      };

      const generateQR = (e) => {
         e.preventDefault();
         if(!companyProfile?.upiId) { showToast("Error: Configure Firm UPI ID in Settings!"); return; }
         const client = visibleClients.find(c => c.clientId === qrForm.clientId);
         const cName = client ? client.clientName : 'Unknown';
         const refNo = `QR${Date.now().toString().slice(-6)}`;
         const upiString = `upi://pay?pa=${companyProfile.upiId}&pn=${encodeURIComponent(companyProfile.companyName || 'Firm')}&am=${qrForm.amount}&tr=${refNo}&cu=INR`;
         const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiString)}`;
         setGeneratedQR({ url: qrUrl, refNo, amount: qrForm.amount, clientName: cName });
         insertRecord('paymentLinks', { linkId: getNextId(paymentLinks, 'PAY'), clientId: qrForm.clientId, clientName: cName, mobile: qrForm.mobile, amount: qrForm.amount, status: 'Pending', qrRefNo: refNo });
         showToast("QR Code Generated!");
      };

      const markQrPaid = (payItem) => {
         updateRecord('paymentLinks', { ...payItem, status: 'Paid' }); showToast(`Payment ${payItem.qrRefNo} marked Paid!`);
      };

      // Modals
      const openAddClient = () => { setEditingItem(null); setClientForm({ clientId: getNextId(clientsData, 'C'), clientName: '', mobile: '', email: '', legalName: '', constitution: 'Individual', status: 'Active', pan: '', gstin: '', adhar: '', address: '', branchId: currentUser?.assignedBranch || 'HQ', notes: '', folderUrl: '' }); setIsFormOpen(true); };
      const openAddComp = () => { setEditingItem(null); setCompForm({ ComplianceID: getNextId(compliancesData, 'CMP'), Date: new Date().toISOString().split('T')[0], CompllianceName: '', ComplianceFrequency: 'Annually', PeriodOfCompliance: '', ClientID: '', ClientName: '', Priority: 'Medium', DueDate: '', StatusofCompliance: 'Pending', ProfessionalFee: '', ProformaInvoiceNo: '', PaymentStatus: 'Unpaid', ComplianceFolderUrl: '', AknNo: '', AknUrl: '', Comments: '' }); setIsComplianceFormOpen(true); };
      const openAddCred = () => { setEditingItem(null); setCredForm({ CredentialID: getNextId(credentialsData, 'CRD'), ClientID: '', ClientName: '', PortalName: '', URL: '', Username: '', Password: '', Notes: '' }); setIsCredentialFormOpen(true); };

    // ==========================================
    // 3. SECURE AUTH & FIREBASE INITIALIZER
    // ==========================================
    function FirebaseAppWrapper() {
      const [data, setData] = useState({ clients: [], compliances: [], credentials: [] });
      const [companyProfile, setCompanyProfile] = useState(null);
      const [paymentLinks, setPaymentLinks] = useState([]);
      const [loading, setLoading] = useState(true);
      const [user, setUser] = useState(null);
      const [userRole, setUserRole] = useState(null); 
      const [fb, setFb] = useState(null); 
      const [isMockMode, setIsMockMode] = useState(false);

      // Auth UI States
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [authMode, setAuthMode] = useState('login'); 
      const [authError, setAuthError] = useState('');
      const [isAuthenticating, setIsAuthenticating] = useState(false);
      const [showPassword, setShowPassword] = useState(false);

      const adminEmails = ['admin@cmfilings.com', 'demo@cmfilings.com'];

      useEffect(() => {
        const rawLoader = document.getElementById('fallback-loader');
        if (rawLoader) rawLoader.style.display = 'none';
      }, []);

      useEffect(() => {
        let unsubAuth = null;
        let unsubs = [];

        const initFirebase = async () => {
          try {
            await window.firebaseLoadPromise;
            const FB = window.FirebaseAPI;
            const config = MY_FIREBASE_CONFIG;
            const app = FB.initializeApp(config);
            const auth = FB.getAuth(app);
            const db = FB.getFirestore(app);
            
            setFb({ db, auth, FB, appId: config.appId, addDoc: FB.addDoc, updateDoc: FB.updateDoc, deleteDoc: FB.deleteDoc, collection: FB.collection, doc: FB.doc, setDoc: FB.setDoc });

            unsubAuth = FB.onAuthStateChanged(auth, (currentUser) => {
              if (currentUser) {
                 const isAdmin = adminEmails.includes(currentUser.email?.toLowerCase());
                 setUserRole(isAdmin ? 'admin' : 'client');
                 setUser({ ...currentUser, role: isAdmin ? 'admin' : 'client', assignedBranch: 'HQ' }); 
                 
                 const baseRef = (collName) => FB.collection(db, 'artifacts', config.appId, 'orgData', 'main', collName); 
                 const profileRef = FB.doc(db, 'artifacts', config.appId, 'settings', 'companyProfile');

                 let cList = [], compList = [], credList = [], payList = [];
                 let loaded = 0;
                 const checkLoaded = () => { 
                   loaded++; 
                   if(loaded === 5) { 
                      setData({clients: cList, compliances: compList, credentials: credList}); 
                      setPaymentLinks(payList);
                      setLoading(false); 
                   } 
                 };

                 unsubs.push(FB.onSnapshot(baseRef('clients'), (snap) => { cList = snap.docs.map(d => ({ id: d.id, ...d.data() })); if(loaded < 5) checkLoaded(); else setData(prev => ({...prev, clients: cList})); }, activateDemoMode));
                 unsubs.push(FB.onSnapshot(baseRef('compliances'), (snap) => { compList = snap.docs.map(d => ({ id: d.id, ...d.data() })); if(loaded < 5) checkLoaded(); else setData(prev => ({...prev, compliances: compList})); }, activateDemoMode));
                 unsubs.push(FB.onSnapshot(baseRef('credentials'), (snap) => { credList = snap.docs.map(d => ({ id: d.id, ...d.data() })); if(loaded < 5) checkLoaded(); else setData(prev => ({...prev, credentials: credList})); }, activateDemoMode));
                 unsubs.push(FB.onSnapshot(baseRef('paymentLinks'), (snap) => { payList = snap.docs.map(d => ({ id: d.id, ...d.data() })); if(loaded < 5) checkLoaded(); else setPaymentLinks(payList); }, activateDemoMode));
                 unsubs.push(FB.onSnapshot(profileRef, (snap) => { setCompanyProfile(snap.exists() ? snap.data() : { companyName: '', upiId: '' }); if(loaded < 5) checkLoaded(); }, activateDemoMode));
              } else {
                 setUser(null);
                 setLoading(false);
              }
            });
          } catch (e) { activateDemoMode(); }
        };
        
        initFirebase();
        return () => { if (unsubAuth) unsubAuth(); unsubs.forEach(u => u()); };
      }, []);

      const activateDemoMode = () => {
        setIsMockMode(true);
        setData({
           clients: [{ id: '1', clientId: 'C40001', clientName: 'Demo Client', mobile: '9876543210', status: 'Active', branchId: 'HQ' }],
           compliances: [{ id: '1', ComplianceID: 'CMP1', CompllianceName: 'GST Returns', ClientID: 'C40001', PaymentStatus: 'Unpaid', ProfessionalFee: '1500', StatusofCompliance: 'Pending' }],
           credentials: []
        });
        setCompanyProfile({ companyName: 'Demo Agency', upiId: 'demo@upi' });
        setPaymentLinks([{ id: '1', qrRefNo: 'QR123456', amount: '1500', status: 'Pending', clientName: 'Demo Client' }]);
        setUser({ role: 'admin', assignedBranch: 'HQ' });
        setLoading(false);
      };

      // --- AUTH METHODS ---
      const handleEmailAuth = async (e) => {
        e.preventDefault();
        setAuthError(''); setIsAuthenticating(true);
        try {
          if (authMode === 'signup') {
            await fb.FB.createUserWithEmailAndPassword(fb.auth, email, password);
          } else {
            await fb.FB.signInWithEmailAndPassword(fb.auth, email, password);
          }
        } catch (err) {
          setAuthError(err.message.replace("Firebase: ", ""));
          setIsAuthenticating(false);
        }
      };

      const handleGoogleAuth = async () => {
        setAuthError(''); setIsAuthenticating(true);
        try {
          const provider = new fb.FB.GoogleAuthProvider();
          await fb.FB.signInWithPopup(fb.auth, provider);
        } catch (err) {
          setAuthError(err.message.replace("Firebase: ", ""));
          setIsAuthenticating(false);
        }
      };

      const handleLogout = async () => {
         if(fb && fb.auth) await fb.FB.signOut(fb.auth);
         if(isMockMode) { setUser(null); setIsMockMode(false); }
      };

      // --- DB METHODS ---
      const insertRecord = async (collectionName, recordData) => {
         if (isMockMode || !fb || !user) { 
            if(collectionName==='paymentLinks') setPaymentLinks(prev => [...prev, { ...recordData, id: Date.now().toString() }]);
            else setData(prev => ({ ...prev, [collectionName]: [...prev[collectionName], { ...recordData, id: Date.now().toString() }] })); 
            return; 
         }
         try { await fb.addDoc(fb.collection(fb.db, 'artifacts', fb.appId, 'orgData', 'main', collectionName), { ...recordData, createdAt: new Date().toISOString() }); } catch(e) {}
      };
      
      const updateRecord = async (collectionName, recordData) => {
         if (isMockMode || !fb || !user) { 
            if(collectionName==='paymentLinks') setPaymentLinks(prev => prev.map(c => c.id === recordData.id ? recordData : c));
            else setData(prev => ({ ...prev, [collectionName]: prev[collectionName].map(c => c.id === recordData.id ? recordData : c) })); 
            return; 
         }
         try {
             const { id, ...dataToUpdate } = recordData; dataToUpdate.updatedAt = new Date().toISOString();
             await fb.updateDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'orgData', 'main', collectionName, id), dataToUpdate);
         } catch(e) {}
      };
      
      const deleteRecord = async (collectionName, id) => {
         if (isMockMode || !fb || !user) { setData(prev => ({ ...prev, [collectionName]: prev[collectionName].filter(c => c.id !== id) })); return; }
         try { await fb.deleteDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'orgData', 'main', collectionName, id)); } catch(e) {}
      };

      const handleUpdateCompany = async (profileData) => {
         if (isMockMode || !fb || !user) { setCompanyProfile(profileData); return; }
         try { await fb.setDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'settings', 'companyProfile'), profileData); } catch(e) {}
      };
      
      if (loading) {
        return (
           <div className="min-h-screen flex flex-col items-center justify-center bg-gradient-to-br from-indigo-900 via-violet-800 to-indigo-900 p-4 text-center">
              <div className="animate-spin w-12 h-12 border-4 border-indigo-300 border-t-white rounded-full mb-6"></div>
              <h2 className="text-xl font-extrabold text-white tracking-tight">ClientHub CRM</h2>
              <p className="text-sm text-indigo-200 mt-2 font-medium">Initializing secure environment...</p>
           </div>
        );
      }

      // ==========================================
      // SECURE LOGIN SCREEN (Requirement 4)
      // ==========================================
      if (!user) {
         return (
           <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 p-4">
              <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300 border border-slate-100">
                 <div className="bg-indigo-600 p-8 text-center text-white relative">
                    <img src="logo.png" alt="Logo" className="w-16 h-16 mx-auto rounded-2xl mb-4 shadow-md bg-white p-1" onError={(e)=>{e.target.style.display='none'; e.target.nextSibling.style.display='flex';}} />
                    <div className="hidden w-16 h-16 mx-auto rounded-2xl mb-4 bg-white/20 items-center justify-center"><Icon name="users" className="w-8 h-8 text-white" /></div>
                    <h2 className="text-2xl font-extrabold tracking-tight">Client Hub CRM</h2>
                    <p className="text-indigo-200 text-sm font-medium mt-1">Corporate Edition</p>
                 </div>
                 
                 <div className="p-8">
                    {authError && <div className="bg-rose-50 text-rose-600 text-xs font-bold p-3 rounded-lg border border-rose-100 mb-5 text-center">{authError}</div>}
                    
                    <form onSubmit={handleEmailAuth} className="space-y-4">
                       <div>
                         <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1.5">Email Address</label>
                         <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm" placeholder="admin@example.com" />
                       </div>
                       <div className="relative">
                         <div className="flex justify-between items-center mb-1.5">
                            <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-wider">Password</label>
                            {authMode === 'login' && <button type="button" className="text-[10px] font-bold text-indigo-600 hover:text-indigo-800">Forgot?</button>}
                         </div>
                         <input type={showPassword ? "text" : "password"} required value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:bg-white text-sm" placeholder="••••••••" />
                         <button type="button" onClick={()=>setShowPassword(!showPassword)} className="absolute right-4 top-9 text-slate-400 hover:text-slate-600">
                            {showPassword ? <Icon name="eyeOff" className="w-4 h-4"/> : <Icon name="eye" className="w-4 h-4"/>}
                         </button>
                       </div>
                       
                       <button type="submit" disabled={isAuthenticating} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-colors flex justify-center items-center gap-2 mt-2">
                         {isAuthenticating ? <Spinner className="w-5 h-5 animate-spin" /> : (authMode === 'signup' ? 'Create Account' : 'Secure Login')}
                       </button>
                    </form>

                    <div className="my-6 flex items-center">
                       <div className="flex-grow border-t border-slate-200"></div>
                       <span className="flex-shrink-0 px-4 text-slate-400 text-xs font-bold uppercase">Or Client Access</span>
                       <div className="flex-grow border-t border-slate-200"></div>
                    </div>

                    <button type="button" onClick={handleGoogleAuth} disabled={isAuthenticating} className="w-full bg-white border border-slate-200 text-slate-700 font-bold py-3.5 rounded-xl shadow-sm hover:bg-slate-50 transition-colors flex justify-center items-center gap-3">
                       <svg className="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                       Sign in with Google
                    </button>

                    <div className="mt-6 text-center text-xs text-slate-500 font-medium">
                       {authMode === 'login' ? (
                          <p>New client? <button onClick={()=>setAuthMode('signup')} className="text-indigo-600 font-bold hover:underline">Request Account</button></p>
                       ) : (
                          <p>Have an account? <button onClick={()=>setAuthMode('login')} className="text-indigo-600 font-bold hover:underline">Login Here</button></p>
                       )}
                       <p className="mt-4"><button onClick={activateDemoMode} className="text-amber-500 hover:text-amber-600 font-bold text-[10px] uppercase">Skip to Offline Demo</button></p>
                    </div>
                 </div>
              </div>
           </div>
         );
      }

      return (
        <ErrorBoundary>
          <App clientsData={data.clients} compliancesData={data.compliances} credentialsData={data.credentials} companyProfile={companyProfile} paymentLinks={paymentLinks} insertRecord={insertRecord} updateRecord={updateRecord} deleteRecord={deleteRecord} setCompanyProfile={handleUpdateCompany} currentUser={user} handleLogout={handleLogout} isMockMode={isMockMode} />
        </ErrorBoundary>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FirebaseAppWrapper />);
  </script>
</body>
</html>
