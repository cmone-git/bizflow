<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientHub CRM (Corporate Edition)</title>
  
  <script>
    window.onerror = function(msg, url, line, col, error) {
      var loader = document.getElementById('fallback-loader');
      if (loader) loader.innerHTML = '<div style="padding:20px;color:#dc2626;text-align:left;font-family:monospace;font-size:12px;background:#fef2f2;min-height:100vh;"><b>🚨 CRASH REPORT:</b><br><br>' + msg + '<br>Line: ' + line + '</div>';
    };
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script>window.react = window.React;</script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>

  <!-- Bulletproof Firebase Loading Sequence -->
  <script type="module">
    window.firebaseLoadPromise = (async () => {
      try {
        const appMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
        const authMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
        const fsMod = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
        
        window.FirebaseAPI = {
          initializeApp: appMod.initializeApp, getAuth: authMod.getAuth, signInAnonymously: authMod.signInAnonymously, onAuthStateChanged: authMod.onAuthStateChanged,
          getFirestore: fsMod.getFirestore, collection: fsMod.collection, doc: fsMod.doc, addDoc: fsMod.addDoc, updateDoc: fsMod.updateDoc, deleteDoc: fsMod.deleteDoc, onSnapshot: fsMod.onSnapshot
        };
      } catch (err) {
        console.error("Firebase load error:", err);
      }
    })();
  </script>
</head>
<body class="bg-slate-50 text-slate-800">
  
  <div id="fallback-loader" class="min-h-screen flex flex-col items-center justify-center p-4 text-center">
     <div class="animate-spin w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full mb-4"></div>
     <h2 class="text-lg font-bold text-slate-900">Starting CRM Engine...</h2>
     <p class="text-sm text-slate-500 mt-2">Loading secure corporate modules.</p>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // ==========================================
    // EXTENDED CORPORATE SVG ICONS
    // ==========================================
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const paths = {
        users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
        barChart: <><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></>,
        list: <><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>,
        phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>,
        grid: <><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></>,
        plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
        search: <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
        x: <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
        edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
        trash: <><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>,
        shieldCheck: <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></>,
        database: <><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></>,
        upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>,
        download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
        fileText: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></>,
        key: <><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></>,
        menu: <><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></>,
        clock: <><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
        checkCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{paths[name] || paths.list}</svg>
      );
    };

    const Spinner = ({ className = "w-5 h-5 animate-spin" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
    );

    // ==========================================
    // DONUT CHART COMPONENT
    // ==========================================
    const DonutChart = ({ data }) => {
      // Data format: [{ label: 'Pending', value: 10, color: '#f59e0b' }]
      const total = data.reduce((acc, item) => acc + item.value, 0);
      let cumulativePercent = 0;

      if (total === 0) {
        return (
          <div className="flex flex-col items-center justify-center h-40">
            <Icon name="clock" className="w-10 h-10 text-slate-200 mb-2" />
            <span className="text-xs text-slate-400 font-medium">No Compliances Logged</span>
          </div>
        );
      }

      return (
        <div className="flex items-center gap-6">
          <svg viewBox="0 0 36 36" className="w-32 h-32 transform -rotate-90">
            {data.map((slice, i) => {
              const percent = (slice.value / total) * 100;
              const strokeDasharray = `${percent} ${100 - percent}`;
              const strokeDashoffset = -cumulativePercent;
              cumulativePercent += percent;
              
              return (
                <circle key={i} r="15.91549430918954" cx="18" cy="18" fill="transparent" stroke={slice.color} strokeWidth="4" strokeDasharray={strokeDasharray} strokeDashoffset={strokeDashoffset} className="transition-all duration-1000 ease-out" />
              );
            })}
          </svg>
          <div className="flex flex-col gap-2 flex-1">
            {data.map((slice, i) => (
              <div key={i} className="flex items-center justify-between text-xs">
                <div className="flex items-center gap-1.5">
                  <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: slice.color }}></span>
                  <span className="text-slate-600 font-semibold">{slice.label}</span>
                </div>
                <span className="font-bold text-slate-900">{slice.value}</span>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // ==========================================
    // 2. Main Application UI Component
    // ==========================================
    function App({ clientsData, compliancesData, credentialsData, insertRecord, updateRecord, deleteRecord, isMockMode }) {
      
      const [activeTab, setActiveTab] = useState('analytics'); // analytics, compliances, credentials, contacts, menu
      const [toastMessage, setToastMessage] = useState(null);

      // Form States
      const [isClientFormOpen, setIsClientFormOpen] = useState(false);
      const [isComplianceFormOpen, setIsComplianceFormOpen] = useState(false);
      const [isCredentialFormOpen, setIsCredentialFormOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      // Schema States
      const [clientForm, setClientForm] = useState({});
      const [compForm, setCompForm] = useState({});
      const [credForm, setCredForm] = useState({});

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      // Generators
      const getNextId = (dataArray, prefix) => {
        let maxNum = 40000;
        dataArray.forEach(c => {
          const num = parseInt(c[`${prefix.toLowerCase()}Id`]?.replace(/\D/g, '') || '0', 10);
          if (!isNaN(num) && num > maxNum) maxNum = num;
        });
        return `${prefix}${maxNum + 1}`;
      };

      // ==========================================
      // DASHBOARD ANALYTICS
      // ==========================================
      const kpis = useMemo(() => {
        const total = clientsData.length;
        const active = clientsData.filter(c => c.status === 'Active').length;
        return { total, active, activePct: total > 0 ? Math.round((active / total) * 100) : 0 };
      }, [clientsData]);

      const compChartData = useMemo(() => {
        let pending = 0, completed = 0, overdue = 0;
        const today = new Date().toISOString().split('T')[0];
        
        compliancesData.forEach(c => {
          if (c.StatusofCompliance === 'Completed') completed++;
          else if (c.DueDate && c.DueDate < today) overdue++;
          else pending++;
        });

        return [
          { label: 'Completed', value: completed, color: '#10b981' }, // Emerald
          { label: 'Pending', value: pending, color: '#6366f1' },    // Indigo
          { label: 'Overdue', value: overdue, color: '#ef4444' }     // Rose
        ];
      }, [compliancesData]);

      // ==========================================
      // FORM HANDLERS
      // ==========================================
      const handleSaveClient = (e) => {
        e.preventDefault();
        if (editingItem) { updateRecord('clients', { ...clientForm, id: editingItem.id }); showToast("Client Updated"); } 
        else { insertRecord('clients', clientForm); showToast("Client Created"); }
        setIsClientFormOpen(false);
      };

      const handleSaveCompliance = (e) => {
        e.preventDefault();
        // Auto-fetch client name if client ID is selected
        const linkedClient = clientsData.find(c => c.clientId === compForm.ClientID);
        const finalForm = { ...compForm, ClientName: linkedClient ? linkedClient.clientName : compForm.ClientName };
        
        if (editingItem) { updateRecord('compliances', { ...finalForm, id: editingItem.id }); showToast("Compliance Updated"); } 
        else { insertRecord('compliances', finalForm); showToast("Compliance Logged"); }
        setIsComplianceFormOpen(false);
      };

      const handleSaveCredential = (e) => {
        e.preventDefault();
        const linkedClient = clientsData.find(c => c.clientId === credForm.ClientID);
        const finalForm = { ...credForm, ClientName: linkedClient ? linkedClient.clientName : credForm.ClientName };

        if (editingItem) { updateRecord('credentials', { ...finalForm, id: editingItem.id }); showToast("Vault Updated"); } 
        else { insertRecord('credentials', finalForm); showToast("Credentials Saved"); }
        setIsCredentialFormOpen(false);
      };

      const openAddComp = () => {
        setEditingItem(null);
        setCompForm({
          ComplianceID: getNextId(compliancesData, 'CMP'), Date: new Date().toISOString().split('T')[0], 
          CompllianceName: '', ComplianceFrequency: 'Annually', PeriodOfCompliance: '', ClientID: '', 
          ClientName: '', Priority: 'Medium', DueDate: '', StatusofCompliance: 'Pending', ProfessionalFee: '', 
          ProformaInvoiceNo: '', PaymentStatus: 'Unpaid', ComplianceFolderUrl: '', AknNo: '', AknUrl: '', Comments: ''
        });
        setIsComplianceFormOpen(true);
      };

      const openAddCred = () => {
        setEditingItem(null);
        setCredForm({
          CredentialID: getNextId(credentialsData, 'CRD'), ClientID: '', ClientName: '', PortalName: '', 
          URL: '', Username: '', Password: '', Notes: ''
        });
        setIsCredentialFormOpen(true);
      };

      // ==========================================
      // CSV DOWNLOAD / UPLOAD TOOLS
      // ==========================================
      const downloadCsv = (type) => {
        let headers = ""; let sample = ""; let filename = "";
        if (type === 'clients') {
          headers = "ClientId,ClientName,Mobile,Email,LegalName,Constitution,Status,Pan,Gstin,Adhar,Address,BranchId,Notes,ClientFolderUrl\n";
          sample = "C40001,Acme Corp,9876543210,contact@acme.com,Acme Corporation Ltd,Private Limited,Active,ABCDE1234F,29ABCDE1234F1Z5,,123 Main St,HQ,Notes,https://drive.google.com/...\n";
          filename = "Clients_Template.csv";
        } else if (type === 'compliances') {
          headers = "ComplianceID,Date,CompllianceName,ComplianceFrequency,PeriodOfCompliance,ClientID,ClientName,Priority,DueDate,StatusofCompliance,ProfessionalFee,ProformaInvoiceNo,PaymentStatus,ComplianceFolderUrl,AknNo,AknUrl,Comments\n";
          sample = "CMP40001,2024-01-01,GST Return,Monthly,Jan 2024,C40001,Acme Corp,High,2024-01-20,Pending,5000,INV-101,Unpaid,,,AKN123,,Needs review\n";
          filename = "Compliances_Template.csv";
        } else {
          headers = "CredentialID,ClientID,ClientName,PortalName,URL,Username,Password,Notes\n";
          sample = "CRD40001,C40001,Acme Corp,Income Tax,https://incometax.gov.in,pan_number,SecurePass123!,Do not share\n";
          filename = "Credentials_Template.csv";
        }
        const blob = new Blob([headers + sample], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = window.URL.createObjectURL(blob);
        a.download = filename;
        a.click();
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans antialiased pb-24">
          
          {isMockMode && (
             <div className="bg-amber-500 text-white text-xs font-bold px-4 py-2 text-center flex justify-center items-center gap-2">
                <Icon name="database" className="w-4 h-4" /> 
                Running in Demo Mode. Connect Firebase to save data permanently.
             </div>
          )}

          {toastMessage && (
            <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[80] flex items-center gap-2 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl text-sm w-11/12 max-w-sm">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400 shrink-0" />
              <span className="truncate font-medium">{toastMessage}</span>
            </div>
          )}

          {/* TOP HEADER */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200">
                    <Icon name="users" className="w-5 h-5" />
                  </div>
                  <div>
                    <h1 className="text-lg font-bold text-slate-900 leading-tight">Client Hub</h1>
                    <p className="text-[10px] text-slate-500 font-medium uppercase tracking-wider">Corporate Edition</p>
                  </div>
                </div>
              </div>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
            
            {/* TAB 1: DASHBOARD (Analytics) */}
            {activeTab === 'analytics' && (
              <div className="space-y-6 animate-in fade-in">
                
                {/* Unified Master Stats */}
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {/* Client Overview Card */}
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div className="flex items-center justify-between mb-4">
                       <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Portfolio</span>
                       <div className="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center"><Icon name="users" className="w-5 h-5" /></div>
                    </div>
                    <div>
                      <div className="text-4xl font-extrabold text-slate-900">{kpis.total}</div>
                      <div className="flex items-center text-sm text-slate-500 mt-2"><span className="font-bold text-emerald-600 mr-2">{kpis.activePct}%</span> active clients registered</div>
                    </div>
                  </div>

                  {/* Compliance Donut Card */}
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div className="flex items-center justify-between mb-2">
                       <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Compliance Status</span>
                       <div className="w-10 h-10 rounded-xl bg-fuchsia-50 text-fuchsia-600 flex items-center justify-center"><Icon name="fileText" className="w-5 h-5" /></div>
                    </div>
                    <DonutChart data={compChartData} />
                  </div>
                </div>

                {/* Quick Client List */}
                <div>
                   <div className="flex items-center justify-between mb-3">
                      <h3 className="font-bold text-slate-800">Recent Clients</h3>
                   </div>
                   <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                     {clientsData.slice(0, 5).map(c => (
                        <div key={c.id} className="p-4 border-b border-slate-100 flex items-center justify-between hover:bg-slate-50">
                           <div>
                              <div className="font-bold text-slate-900">{c.clientName}</div>
                              <div className="text-xs text-slate-500 font-mono mt-0.5">{c.clientId}</div>
                           </div>
                           <div className={`px-2.5 py-1 rounded-md text-[10px] font-bold ${c.status === 'Active' ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>{c.status}</div>
                        </div>
                     ))}
                     {clientsData.length === 0 && <div className="p-6 text-center text-slate-400 text-sm">No clients added yet.</div>}
                   </div>
                </div>
              </div>
            )}

            {/* TAB 2: COMPLIANCES */}
            {activeTab === 'compliances' && (
              <div className="space-y-4 animate-in fade-in">
                 <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                       <h2 className="font-bold text-slate-900 text-lg">Compliance Tracker</h2>
                       <p className="text-xs text-slate-500">Manage filings, returns, and deadlines.</p>
                    </div>
                    <button onClick={openAddComp} className="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md hover:bg-indigo-700"><Icon name="plus" className="w-5 h-5" /></button>
                 </div>

                 <div className="space-y-3">
                    {compliancesData.map(comp => (
                       <div key={comp.id} onClick={() => { setEditingItem(comp); setCompForm({...comp}); setIsComplianceFormOpen(true); }} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-indigo-300">
                          <div className="flex justify-between items-start mb-2">
                             <span className="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-md">{comp.ComplianceID}</span>
                             <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${comp.StatusofCompliance === 'Completed' ? 'bg-emerald-50 text-emerald-600' : comp.StatusofCompliance === 'Pending' ? 'bg-amber-50 text-amber-600' : 'bg-rose-50 text-rose-600'}`}>{comp.StatusofCompliance}</span>
                          </div>
                          <h4 className="font-extrabold text-slate-900">{comp.CompllianceName}</h4>
                          <div className="text-xs font-semibold text-slate-600 mt-1">{comp.ClientName || 'Unknown Client'}</div>
                          
                          <div className="flex items-center gap-4 mt-3 pt-3 border-t border-slate-100 text-[10px] text-slate-500 font-medium">
                             <div className="flex items-center gap-1"><Icon name="clock" className="w-3.5 h-3.5" /> Due: {comp.DueDate || 'N/A'}</div>
                             <div className="flex items-center gap-1"><Icon name="list" className="w-3.5 h-3.5" /> {comp.PeriodOfCompliance || 'N/A'}</div>
                          </div>
                       </div>
                    ))}
                    {compliancesData.length === 0 && <div className="py-12 text-center text-slate-400 font-medium">No compliances tracked.</div>}
                 </div>
              </div>
            )}

            {/* TAB 3: CREDENTIALS VAULT */}
            {activeTab === 'credentials' && (
              <div className="space-y-4 animate-in fade-in">
                 <div className="flex justify-between items-center bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                       <h2 className="font-bold text-slate-900 text-lg">Secure Vault</h2>
                       <p className="text-xs text-slate-500">Manage portal credentials and passwords.</p>
                    </div>
                    <button onClick={openAddCred} className="bg-indigo-600 text-white p-2.5 rounded-xl shadow-md hover:bg-indigo-700"><Icon name="plus" className="w-5 h-5" /></button>
                 </div>

                 <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {credentialsData.map(cred => (
                       <div key={cred.id} onClick={() => { setEditingItem(cred); setCredForm({...cred}); setIsCredentialFormOpen(true); }} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm cursor-pointer hover:border-indigo-300 flex items-center gap-4">
                          <div className="w-12 h-12 rounded-xl bg-slate-100 text-slate-400 flex items-center justify-center shrink-0"><Icon name="key" className="w-6 h-6" /></div>
                          <div className="overflow-hidden flex-1">
                             <h4 className="font-bold text-slate-900 truncate">{cred.PortalName || 'Unnamed Portal'}</h4>
                             <div className="text-xs font-semibold text-slate-600 truncate mt-0.5">{cred.ClientName || 'Unknown Client'}</div>

                     <div>

                        <select value={compForm.PaymentStatus} onChange={(e) => setCompForm({...compForm, PaymentStatus: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg shadow-sm bg-white">

                     <div><label className="block text-slate-700 font-bold mb-1.5">Proforma Invoice No.</label><input type="text" value={compForm.ProformaInvoiceNo} onChange={(e) => setCompForm({...compForm, ProformaInvoiceNo: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg shadow-sm" /></div>
                     <div><label className="block text-slate-700 font-bold mb-1.5">Gov. ARN / Challan No.</label><input type="text" value={compForm.AknNo} onChange={(e) => setCompForm({...compForm, AknNo: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg shadow-sm font-mono" /></div>
                     
                     <div className="sm:col-span-2"><label className="block text-slate-700 font-bold mb-1.5">Challan / ARN File URL</label><input type="url" value={compForm.AknUrl} onChange={(e) => setCompForm({...compForm, AknUrl: e.target.value})} placeholder="https://" className="w-full p-2.5 border border-slate-300 rounded-lg shadow-sm text-blue-600" /></div>
                     <div className="sm:col-span-2"><label className="block text-slate-700 font-bold mb-1.5">General Comments</label><textarea value={compForm.Comments} onChange={(e) => setCompForm({...compForm, Comments: e.target.value})} rows={2} className="w-full p-2.5 border border-slate-300 rounded-lg shadow-sm" /></div>
                  </div>
                </form>
                <div className="p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-end space-x-3 shrink-0">
                  <button type="button" onClick={() => setIsComplianceFormOpen(false)} className="px-5 py-2.5 bg-white border border-slate-300 rounded-xl text-slate-700 font-bold hover:bg-slate-50 shadow-sm">Cancel</button>
                  <button onClick={handleSaveCompliance} className="px-6 py-2.5 bg-fuchsia-600 hover:bg-fuchsia-700 text-white rounded-xl font-bold shadow-md transition-colors flex items-center gap-2">Save Record</button>

          )}

          {/* ========================================== */}
          {/* MODAL: CREDENTIAL FORM */}
          {/* ========================================== */}
          {isCredentialFormOpen && (
            <div className="fixed inset-0 z-[60] overflow-y-auto bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4 animate-in fade-in">
              <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden border border-slate-200 my-10 flex flex-col max-h-[90vh]">
                <div className="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold shadow-inner"><Icon name="key" className="w-5 h-5" /></div>
                    <div><h3 className="text-base font-extrabold text-slate-900">{editingItem ? `Edit Vault Entry` : 'Add Credentials'}</h3></div>
                  </div>
                  <button onClick={() => setIsCredentialFormOpen(false)} className="p-2 text-slate-400 bg-white rounded-lg hover:bg-slate-100 transition-colors"><Icon name="x" className="w-5 h-5" /></button>
                </div>
                <form className="flex-1 overflow-y-auto p-4 sm:p-5 space-y-4 text-xs bg-white">
                  <div>
                    <label className="block text-slate-700 font-bold mb-1.5">Link to Client *</label>
                    <select required value={credForm.ClientID} onChange={(e) => setCredForm({...credForm, ClientID: e.target.value})} className="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 shadow-sm bg-white font-semibold">
                        <option value="">-- Select Client --</option>

                    </select>

                  <div><label className="block text-slate-700 font-bold mb-1.5">Login URL</label><input type="url" value={credForm.URL} onChange={(e) => setCredForm({...credForm, URL: e.target.value})} placeholder="https://" className="w-full p-2.5 border border-slate-300 rounded-lg shadow-sm text-blue-600" /></div>

    // ==========================================
    // 3. Database & Firebase Initializer
    // ==========================================
    function FirebaseAppWrapper() {
      const [data, setData] = useState({ clients: [], compliances: [], credentials: [] });
      const [loading, setLoading] = useState(true);
      const [user, setUser] = useState(null);
      const [fb, setFb] = useState(null); 
      const [isMockMode, setIsMockMode] = useState(false);

      useEffect(() => {
        const rawLoader = document.getElementById('fallback-loader');
        if (rawLoader) rawLoader.style.display = 'none';
      }, []);

      const activateDemoMode = () => {
        setIsMockMode(true);
        setData({
           clients: [{ id: '1', clientId: 'C40001', clientName: 'Demo Client', mobile: '9876543210', email: 'demo@test.com', status: 'Active', pan: 'ABCDE1234F', gstin: '29ABCDE1234F1Z5' }],
           compliances: [{ id: '1', ComplianceID: 'CMP40001', CompllianceName: 'GST GSTR-3B', ClientID: 'C40001', ClientName: 'Demo Client', StatusofCompliance: 'Pending', DueDate: '2024-12-20' }],
           credentials: [{ id: '1', CredentialID: 'CRD40001', PortalName: 'Income Tax', ClientID: 'C40001', ClientName: 'Demo Client', Username: 'ABCDE1234F' }]
        });
        setLoading(false);
      };

      useEffect(() => {
        let unsubClients = null; let unsubComp = null; let unsubCred = null; let unsubAuth = null;

        const initFirebase = async () => {
          try {
            await window.firebaseLoadPromise;
            const FB = window.FirebaseAPI;
            const config = MY_FIREBASE_CONFIG;
            const app = FB.initializeApp(config);
            const auth = FB.getAuth(app);
            const db = FB.getFirestore(app);
            
            setFb({ db, appId: config.appId, addDoc: FB.addDoc, updateDoc: FB.updateDoc, deleteDoc: FB.deleteDoc, collection: FB.collection, doc: FB.doc });
            await FB.signInAnonymously(auth);

            unsubAuth = FB.onAuthStateChanged(auth, (currentUser) => {
              setUser(currentUser);
              if (currentUser) {
                 const baseRef = (collName) => FB.collection(db, 'artifacts', config.appId, 'users', currentUser.uid, collName);
                 
                 let cList = [], compList = [], credList = [];
                 let loaded = 0;
                 const checkLoaded = () => { loaded++; if(loaded === 3) { setData({clients: cList, compliances: compList, credentials: credList}); setLoading(false); } };

                 unsubClients = FB.onSnapshot(baseRef('clients'), (snap) => { cList = snap.docs.map(d => ({ id: d.id, ...d.data() })); if(loaded < 3) checkLoaded(); else setData(prev => ({...prev, clients: cList})); }, activateDemoMode);
                 unsubComp = FB.onSnapshot(baseRef('compliances'), (snap) => { compList = snap.docs.map(d => ({ id: d.id, ...d.data() })); if(loaded < 3) checkLoaded(); else setData(prev => ({...prev, compliances: compList})); }, activateDemoMode);
                 unsubCred = FB.onSnapshot(baseRef('credentials'), (snap) => { credList = snap.docs.map(d => ({ id: d.id, ...d.data() })); if(loaded < 3) checkLoaded(); else setData(prev => ({...prev, credentials: credList})); }, activateDemoMode);
              }
            });
          } catch (e) { activateDemoMode(); }
        };
        
        initFirebase();
        return () => { if (unsubAuth) unsubAuth(); if (unsubClients) unsubClients(); if (unsubComp) unsubComp(); if (unsubCred) unsubCred(); };
      }, []);

      const insertRecord = async (collectionName, recordData) => {
         if (isMockMode || !fb || !user) { setData(prev => ({ ...prev, [collectionName]: [...prev[collectionName], { ...recordData, id: Date.now().toString() }] })); return; }
         try { await fb.addDoc(fb.collection(fb.db, 'artifacts', fb.appId, 'users', user.uid, collectionName), { ...recordData, createdAt: new Date().toISOString() }); } catch(e) {}
      };
      
      const updateRecord = async (collectionName, recordData) => {
         if (isMockMode || !fb || !user) { setData(prev => ({ ...prev, [collectionName]: prev[collectionName].map(c => c.id === recordData.id ? recordData : c) })); return; }
         try {
             const { id, ...dataToUpdate } = recordData; dataToUpdate.updatedAt = new Date().toISOString();
             await fb.updateDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, collectionName, id), dataToUpdate);
         } catch(e) {}
      };
      
      const deleteRecord = async (collectionName, id) => {
         if (isMockMode || !fb || !user) { setData(prev => ({ ...prev, [collectionName]: prev[collectionName].filter(c => c.id !== id) })); return; }
         try { await fb.deleteDoc(fb.doc(fb.db, 'artifacts', fb.appId, 'users', user.uid, collectionName, id)); } catch(e) {}
      };
      
      if (loading) {
        return (
           <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 gap-4 p-4 text-center">
              <div className="animate-spin w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full mb-2"></div>
              <p className="text-slate-600 font-bold text-lg">Connecting Secure Modules...</p>
           </div>
        );
      }

      return <App clientsData={data.clients} compliancesData={data.compliances} credentialsData={data.credentials} insertRecord={insertRecord} updateRecord={updateRecord} deleteRecord={deleteRecord} isMockMode={isMockMode} />;
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FirebaseAppWrapper />);
  </script>
</body>
